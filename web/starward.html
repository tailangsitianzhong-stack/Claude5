<style>
/* 単一の宇宙ゲーム画面。暗色固定のコックピットHUD。 */
:root {
  --void: #02040a;
  --hud: #73e3ff;
  --hud-dim: rgba(115, 227, 255, 0.38);
  --amber: #ffcf4a;
  --warp: #b49bff;
  --alert: #ff5a46;
  --ink: #e8f8ff;
  --font-hud: "Chakra Petch", "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; background: var(--void); }
body { height: 100%; margin: 0; overflow: hidden; background: var(--void); color: var(--ink); font-family: var(--font-hud); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#wrap { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; }
#gl, #hud { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hud { touch-action: none; }
#start {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-start;
  background: linear-gradient(90deg, rgba(2, 4, 10, 0.94) 0%, rgba(2, 4, 10, 0.78) 42%, rgba(2, 4, 10, 0) 72%);
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 16px; z-index: 5; overflow-y: auto;
}
#start[hidden] { display: none; }
.panel { width: min(30rem, 54%); display: grid; gap: 12px; padding-block: 12px; }
.eyebrow { font-size: 11px; letter-spacing: 0.3em; color: var(--hud); text-transform: uppercase; }
h1 { margin: 0; font-size: clamp(34px, 6vw, 60px); font-weight: 700; letter-spacing: 0.08em; line-height: 0.95; color: var(--ink); }
h1 span { color: var(--hud); }
.picker { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.picker button {
  width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--hud-dim); background: rgba(115, 227, 255, 0.08);
  color: var(--hud); font: 600 16px var(--font-hud); cursor: pointer;
}
.picker button:active { background: rgba(115, 227, 255, 0.3); }
.picker button:focus-visible, #go:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
.pick { min-width: 0; }
.ship-name { font-size: 24px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink); line-height: 1.1; }
.ship-class { font-size: 12px; letter-spacing: 0.12em; color: var(--amber); margin-top: 3px; font-variant-numeric: tabular-nums; }
.desc { margin: 0; font-size: 13px; line-height: 1.55; color: rgba(232, 248, 255, 0.78); min-height: 2.6em; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; }
.stat { display: grid; grid-template-columns: 5.4em 1fr; white-space: nowrap; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.08em; color: rgba(232, 248, 255, 0.7); }
.stat b { height: 5px; background: rgba(115, 227, 255, 0.14); border-radius: 3px; overflow: hidden; display: block; }
.stat b i { display: block; height: 100%; background: var(--hud); border-radius: 3px; transition: width 0.25s; }
.launch { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 14px; }
.bar { height: 4px; background: rgba(115, 227, 255, 0.15); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0%; background: var(--hud); transition: width 0.2s; }
#go {
  font: 600 18px var(--font-hud); letter-spacing: 0.2em; color: var(--void);
  background: var(--hud); border: 0; border-radius: 999px; padding: 11px 32px; cursor: pointer;
}
#go:disabled { opacity: 0.35; cursor: default; }
.keys { margin: 0; font-size: 11px; line-height: 1.6; color: rgba(232, 248, 255, 0.55); }
.keys b { color: var(--hud); font-weight: 600; }
@media (max-height: 430px) {
  .panel { gap: 7px; } h1 { font-size: 30px; } .eyebrow { font-size: 10px; }
  .ship-name { font-size: 20px; } .desc { font-size: 12px; line-height: 1.45; } .keys { display: none; }
  .picker button { width: 40px; height: 40px; } #go { padding: 9px 26px; font-size: 16px; }
}
@media (orientation: portrait) {
  #start { align-items: flex-end; background: linear-gradient(0deg, rgba(2, 4, 10, 0.95) 0%, rgba(2, 4, 10, 0.8) 55%, rgba(2, 4, 10, 0) 85%); }
  .panel { width: 100%; }
}

'use strict';
const TAU = Math.PI * 2;
const V3 = THREE.Vector3, Q = THREE.Quaternion;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const hex = (h) => [((h >> 16) & 255) / 255, ((h >> 8) & 255) / 255, (h & 255) / 255];

// ===================== ノイズ =====================
function h3(i, j, k) {
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(k, 1274126177)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1103515245);
  h ^= h >>> 16;
  return (h & 0xffffff) / 16777215;
}
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const a = h3(xi, yi, zi), b = h3(xi + 1, yi, zi), c = h3(xi, yi + 1, zi), d = h3(xi + 1, yi + 1, zi);
  const e = h3(xi, yi, zi + 1), f = h3(xi + 1, yi, zi + 1), g = h3(xi, yi + 1, zi + 1), hh = h3(xi + 1, yi + 1, zi + 1);
  const x1 = a + (b - a) * u, x2 = c + (d - c) * u, x3 = e + (f - e) * u, x4 = g + (hh - g) * u;
  const y1 = x1 + (x2 - x1) * v, y2 = x3 + (x4 - x3) * v;
  return y1 + (y2 - y1) * w;
}
function fbm(x, y, z, oct) {
  let s = 0, a = 0.5, n = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x, y, z); n += a; x = x * 2.03 + 1.7; y = y * 2.03 + 9.2; z = z * 2.03 + 3.1; a *= 0.5; }
  return s / n;
}

  // 外縁の小惑星帯 235〜255km

];
const SUN_RADIUS = 3000, BELT_INNER = 29000, BELT_OUTER = 33000, BELT_COUNT = 1600;
const OUTER_INNER = 235000, OUTER_OUTER = 255000, OUTER_COUNT = 1400;
const SYSTEM_RADIUS = 290000;
const GATE_COUNT = 10, GATE_RADIUS = 40;

// ===================== レンダラー =====================
const glCanvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, logarithmicDepthBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 1.5 : 2));
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010208);
const camera = new THREE.PerspectiveCamera(CFG.baseFov, 1, 0.3, 2e6);
scene.add(camera);

scene.add(new THREE.AmbientLight(0x1c2233, 1.0));
const sunLight = new THREE.PointLight(0xfff5e6, 1.6, 0, 0);
scene.add(sunLight);

function canvasTex(cv) { const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t; }
function glowTexture(inner, outer) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d'); const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, inner); gr.addColorStop(0.25, outer); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return canvasTex(cv);
}
const GLOW_WHITE = glowTexture('rgba(255,255,255,1)', 'rgba(255,255,255,0.35)');

// ---------- 星空 ----------
const sky = new THREE.Group();
scene.add(sky);
(function buildStars() {
  const make = (n, size, bandBias, bright) => {
    const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
    const bandN = new V3(0.3, 1, 0.2).normalize(); const v = new V3();
    for (let i = 0; i < n; i++) {
      v.set(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1);
      if (v.lengthSq() > 1 || v.lengthSq() < 0.01) { i--; continue; }
      v.normalize();
      if (Math.random() < bandBias) { v.addScaledVector(bandN, -v.dot(bandN) * (0.85 + Math.random() * 0.15)).normalize(); }
      pos.set([v.x * 900000, v.y * 900000, v.z * 900000], i * 3);
      const t = Math.random(), b = bright * (0.35 + Math.random() * 0.65);
      const c = mixc([0.7, 0.8, 1.0], [1.0, 0.85, 0.65], t);
      col.set([c[0] * b, c[1] * b, c[2] * b], i * 3);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const m = new THREE.PointsMaterial({ size, sizeAttenuation: false, vertexColors: true, depthWrite: false, fog: false });
    const p = new THREE.Points(g, m); p.renderOrder = -10; sky.add(p);
  };
  make(4500, 1.4, 0.45, 0.9);
  make(500, 2.4, 0.2, 1.0);
  // 星雲
  const nebCols = [0x5a1a73, 0x0d4073, 0x30205a, 0x123a5a];
  const bandN = new V3(0.3, 1, 0.2).normalize();
  for (let i = 0; i < 14; i++) {
    const v = new V3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1).normalize();
    v.addScaledVector(bandN, -v.dot(bandN) * 0.9).normalize();
    const sm = new THREE.SpriteMaterial({ map: GLOW_WHITE, color: nebCols[i % 4], transparent: true, opacity: 0.14 + Math.random() * 0.12, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
    const s = new THREE.Sprite(sm); s.position.copy(v.multiplyScalar(850000)); s.scale.setScalar(250000 + Math.random() * 350000);
    s.renderOrder = -11; sky.add(s);
  }
})();

// ---------- 大気シェーダー ----------
const ATMO_VS = `
#include <common>
#include <logdepthbuf_pars_vertex>
varying vec3 vN; varying vec3 vP;
void main() {
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vP = wp.xyz; vN = normalize(mat3(modelMatrix) * normal);
  gl_Position = projectionMatrix * viewMatrix * wp;
  #include <logdepthbuf_vertex>
}`;
const ATMO_FS = `
#include <common>
#include <logdepthbuf_pars_fragment>
uniform vec3 color; uniform float strength;
varying vec3 vN; varying vec3 vP;
void main() {
  #include <logdepthbuf_fragment>
  vec3 n = normalize(vN); vec3 v = normalize(cameraPosition - vP); vec3 l = normalize(-vP);
  float rim = 1.0 - clamp(dot(n, v), 0.0, 1.0);
  float lit = smoothstep(-0.35, 0.5, dot(n, l));
  float a = pow(rim, 2.2) * lit * strength;
  gl_FragColor = vec4(color * a * 1.4, 1.0);
}`;

// ---------- 天体テクスチャ生成 ----------
function shade(p, x, y, z, out) {
  const sc = 2.5, s = p.seed;
  const px = x * sc + s, py = y * sc + s, pz = z * sc + s;
  let col, em = null;
  if (p.type === 0) {
    const h = fbm(px, py, pz, 5), sea = p.sea;
    if (h < sea) col = mixc(mixc([0, 0, 0], p.a, 0.45), p.a, smooth(sea - 0.25, sea, h));
    else col = mixc(p.b, p.c, smooth(sea, sea + 0.22, h));
    const lat = Math.abs(y) + (h - 0.5) * 0.2;
    col = mixc(col, [0.92, 0.95, 1.0], smooth(0.8, 0.88, lat));
  } else if (p.type === 2) {
    const warp = fbm(px, py * 3, pz, 4);
    const yv = y * 9 + warp * 3;
    const b1 = Math.sin(yv) * 0.5 + 0.5, b2 = Math.sin(yv * 2.7 + 1.3) * 0.5 + 0.5;
    col = mixc(mixc(p.a, p.b, b1), p.c, b2 * 0.5);
    const sx = x - 0.8, sy = y + 0.35, sz2 = z - 0.5; const sd = Math.sqrt(sx * sx + sy * sy + sz2 * sz2) / 1.05;
    col = mixc(col, [p.b[0] * 0.8 + 0.15, p.b[1] * 0.8 + 0.02, p.b[2] * 0.8], smooth(0.18, 0.08, sd + warp * 0.05));
  } else if (p.type === 3) {
    const h = fbm(px, py, pz, 5);
    const ridge = 1 - Math.abs(fbm(px * 2 + 3, py * 2 + 3, pz * 2 + 3, 4) * 2 - 1);
    col = mixc(mixc(p.a, p.c, h), p.b, smooth(0.86, 0.96, ridge));
  } else if (p.type === 4) {
    const h = fbm(px, py, pz, 5);
    const ridge = 1 - Math.abs(fbm(px * 1.5 + 7, py * 1.5 + 7, pz * 1.5 + 7, 5) * 2 - 1);
    const crack = smooth(0.84, 0.96, ridge);
    col = mixc(mixc(p.a, p.b, h), [p.c[0] * 0.3, p.c[1] * 0.3, p.c[2] * 0.3], crack);
    em = [p.c[0] * crack, p.c[1] * crack, p.c[2] * crack];
  } else {
    const h = fbm(px, py, pz, 5), cr = fbm(px * 3, py * 3, pz * 3, 3);
    col = mixc(p.a, p.b, h);
    const k = 0.75 + 0.5 * smooth(0.35, 0.65, cr);
    col = [col[0] * k, col[1] * k, col[2] * k];
  }
  out.col = col; out.em = em;
  if (p.clouds) {
    const q = 1.6 * sc;
    const qx = x * q + s * 2, qy = y * q + s * 2, qz = z * q + s * 2;
    const w = fbm(qx * 1.5, qy * 1.5, qz * 1.5, 3);
    out.cloud = smooth(0.5, 0.72, fbm(qx + w, qy + w, qz + w, 4)) * 0.9;
  }
}

async function genPlanetTextures(p, onRow) {
  const W = p.tex, H = p.tex / 2;
  const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
  const cv = mk(), g = cv.getContext('2d'), img = g.createImageData(W, H), d = img.data;
  let ecv, eg, eimg, ed, ccv, cg, cimg, cd;
  if (p.type === 4) { ecv = mk(); eg = ecv.getContext('2d'); eimg = eg.createImageData(W, H); ed = eimg.data; }

function buildRings(p, root) {
  const inner = p.radius * 1.25, outer = p.radius * 2.45;
  const geo = new THREE.RingGeometry(inner, outer, 128, 1);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const r = Math.hypot(pos.getX(i), pos.getY(i));
    uv.setXY(i, (r - inner) / (outer - inner), 0.5);
  }
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 1;
  const g = cv.getContext('2d'); const img = g.createImageData(512, 1);
  for (let x = 0; x < 512; x++) {
    const t = x / 511;
    const bands = vnoise(t * 60, 0, 0) * 0.6 + vnoise(t * 200, 3, 0) * 0.4;
    const gap = smooth(0.02, 0, Math.abs(t - 0.62));
    const a = bands * smooth(0, 0.05, t) * smooth(1, 0.9, t) * (1 - gap);
    const k = 0.6 + bands * 0.5;
    const rc = p.ringColor || [217, 191, 153];
    img.data.set([rc[0] * k, rc[1] * k, rc[2] * k, clamp(a * 0.85, 0, 1) * 255], x * 4);
  }
  g.putImageData(img, 0, 0);
  const tex = canvasTex(cv);
  const ring = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, roughness: 1, depthWrite: false }));
  ring.rotation.set(-Math.PI / 2 + 0.21, 0, 0.14);
  root.add(ring);
}

async function buildPlanets(progress) {
  const total = PLANETS.reduce((s, p) => s + p.tex * p.tex / 2, 0);
  let done = 0;
  for (const p of PLANETS) {
    const tex = await genPlanetTextures(p, (n) => { done += n; progress(done / total); });
    const root = new THREE.Group(); scene.add(root);
    const mat = new THREE.MeshStandardMaterial({ map: tex.map, roughness: 0.92, metalness: 0 });
    if (tex.emissive) { mat.emissiveMap = tex.emissive; mat.emissive = new THREE.Color(0xffffff); mat.emissiveIntensity = 1.4; }
    const surf = new THREE.Mesh(new THREE.SphereGeometry(p.radius, 96, 48), mat);
    surf.rotation.z = (Math.random() - 0.5) * 0.6;
    root.add(surf);
    let clouds = null;
    if (tex.clouds) {
      clouds = new THREE.Mesh(new THREE.SphereGeometry(p.radius * 1.012, 96, 48), new THREE.MeshStandardMaterial({ map: tex.clouds, transparent: true, roughness: 1, depthWrite: false }));
      surf.add(clouds); clouds.scale.setScalar(1);
    }
    if (p.atmo) {
      const am = new THREE.ShaderMaterial({ vertexShader: ATMO_VS, fragmentShader: ATMO_FS, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
        uniforms: { color: { value: new THREE.Color(p.atmo) }, strength: { value: p.atmoStrength } } });
      root.add(new THREE.Mesh(new THREE.SphereGeometry(p.radius * 1.07, 64, 32), am));
    }
    if (p.rings) buildRings(p, root);
    bodies.push({ name: p.name, node: root, surf, clouds, radius: p.radius, orbit: p.orbit, angle: p.angle, orbitSpeed: p.orbitSpeed, spin: p.spin, parent: p.parent || '' });
  }
}

function updateOrbits(dt) {
  for (const b of bodies) {
    if (b.surf) b.surf.rotation.y += b.spin * dt;
    if (b.clouds) b.clouds.rotation.y += 0.004 * dt;
    if (!b.orbit) continue;
    b.angle += b.orbitSpeed * dt;
    const c = b.parent ? findBody(b.parent).node.position : new V3();
    b.node.position.set(c.x + Math.cos(b.angle) * b.orbit, c.y, c.z + Math.sin(b.angle) * b.orbit);
  }
}

function nearestBody(p) {
  let best = null, bd = Infinity;
  for (const b of bodies) { const d = p.distanceTo(b.node.position) - b.radius; if (d < bd) { bd = d; best = b; } }
  return best ? { body: best, surface: bd } : null;
}

const astPos = [], astRad = [];
function buildAsteroids(startPos) {
  const geo = new THREE.IcosahedronGeometry(1, 1);
  const pa = geo.attributes.position, v = new V3();
  for (let i = 0; i < pa.count; i++) {
    v.fromBufferAttribute(pa, i).normalize();
    const d = 1 + (vnoise(v.x * 1.8 + 5, v.y * 1.8 + 5, v.z * 1.8 + 5) - 0.5) * 0.9;
    pa.setXYZ(i, v.x * d, v.y * d, v.z * d);
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ color: 0x6b615a, roughness: 0.95, flatShading: true });
  let seed = 2026; const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) | 0; return ((seed >>> 0) / 4294967296); };
  const gauss = () => { let u = 0; for (let i = 0; i < 3; i++) u += rnd(); return (u - 1.5) / 0.5; };
  const xf = [];
  const add = (pos, s) => {
    const scl = new V3(lerp(0.7, 1.3, rnd()), lerp(0.6, 1.1, rnd()), lerp(0.7, 1.4, rnd())).multiplyScalar(s);
    const q = new Q().setFromEuler(new THREE.Euler(rnd() * TAU, rnd() * TAU, rnd() * TAU));
    xf.push(new THREE.Matrix4().compose(pos, q, scl));
    astPos.push(pos); astRad.push((scl.x + scl.y + scl.z) / 3 * 0.95);
  };
  for (let i = 0; i < BELT_COUNT; i++) {
    const a = rnd() * TAU, r = lerp(BELT_INNER, BELT_OUTER, rnd());
    add(new V3(Math.cos(a) * r, gauss() * 350, Math.sin(a) * r), rnd() > 0.05 ? lerp(15, 140, rnd()) : lerp(200, 400, rnd()));
  }
  for (let i = 0; i < OUTER_COUNT; i++) {
    const a = rnd() * TAU, r = lerp(OUTER_INNER, OUTER_OUTER, rnd());
    add(new V3(Math.cos(a) * r, gauss() * 1200, Math.sin(a) * r), rnd() > 0.08 ? lerp(40, 260, rnd()) : lerp(400, 900, rnd()));
  }
  const cl = startPos.clone().add(new V3(2600, 0, -2200));
  for (let i = 0; i < 220; i++) add(cl.clone().add(new V3(gauss(), gauss() * 0.5, gauss()).multiplyScalar(700)), lerp(6, 60, rnd()));
  const im = new THREE.InstancedMesh(geo, mat, xf.length);
  xf.forEach((m, i) => im.setMatrixAt(i, m));
  im.frustumCulled = false;
  scene.add(im);
  astMesh = im; astMats = xf;
  astAlive = new Uint8Array(xf.length).fill(1);
  astHP = Float32Array.from(astRad, r => Math.max(1, r / 12));
}
let astMesh = null, astMats = [], astAlive = new Uint8Array(0), astHP = new Float32Array(0);
function collideAsteroids(p, r, cb) {
  for (let i = 0; i < astPos.length; i++) {
    if (!astAlive[i]) continue;
    const rr = astRad[i] + r;
    if (p.distanceToSquared(astPos[i]) < rr * rr) cb(astPos[i], astRad[i]);
  }
}

const gates = [];
const G = { index: 0, time: 0, best: 0, running: false, finished: false, prevSide: 0 };
function buildGates(startPos) {
  let seed = 77; const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) | 0; return ((seed >>> 0) / 4294967296); };
  const pos = startPos.clone().add(new V3(0, 0, -350));
  const dir = new V3(0.25, 0.15, -1).normalize();
  const geo = new THREE.TorusGeometry(GATE_RADIUS, 3, 10, 48);
  for (let i = 0; i < GATE_COUNT; i++) {
    const mat = new THREE.MeshBasicMaterial({ color: 0x444444 });
    const m = new THREE.Mesh(geo, mat);
    m.position.copy(pos);
    m.quaternion.setFromUnitVectors(new V3(0, 0, 1), dir);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW_WHITE, color: 0xff8a26, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
    glow.scale.setScalar(GATE_RADIUS * 3.2); m.add(glow);
    scene.add(m);
    gates.push({ mesh: m, mat, glow, normal: dir.clone() });
    dir.applyAxisAngle(new V3(0, 1, 0), (rnd() - 0.5) * 1.2);
    const side = new V3().crossVectors(dir, new V3(0, 1, 0)).normalize();
    dir.applyAxisAngle(side, (rnd() - 0.5) * 0.7).normalize();
    pos.addScaledVector(dir, lerp(380, 520, rnd()));
  }
}
function gateSide(i) { if (i >= gates.length) return 0; const g = gates[i]; return ship.pos.clone().sub(g.mesh.position).dot(g.normal); }
function resetGates() { G.index = 0; G.time = 0; G.running = false; G.finished = false; G.prevSide = gateSide(0); refreshGates(); }
function refreshGates() {
  gates.forEach((g, i) => {
    let c = 0x40404c, glow = 0;
    if (i < G.index) c = 0x33ff66;
    else if (i === G.index) { c = 0xff8c26; glow = 0.55; }
    else if (i === G.index + 1) c = 0x8a5a26;
    g.mat.color.setHex(c); g.glow.material.opacity = glow;
  });
}
function updateGates(dt) {
  if (G.running) G.time += dt;
  if (G.finished || G.index >= gates.length) return;
  const g = gates[G.index];
  let side = gateSide(G.index);
  if (G.prevSide < 0 && side >= 0) {
    const rel = ship.pos.clone().sub(g.mesh.position);
    const radial = rel.addScaledVector(g.normal, -rel.dot(g.normal));
    if (radial.length() < GATE_RADIUS) {
      if (G.index === 0) { G.running = true; G.time = 0; }
      G.index++; cam.shake += 0.15;
      if (G.index >= gates.length) {
        G.running = false; G.finished = true;
        if (G.best <= 0 || G.time < G.best) { G.best = G.time; showMsg(`コース完走！ 新記録 ${G.time.toFixed(2)} 秒`, 4); }
        else showMsg(`コース完走！ ${G.time.toFixed(2)} 秒`, 4);
      }
      refreshGates(); side = gateSide(G.index);
    }
  }
  G.prevSide = side;
}

let shipIndex = 0;
let engineBase = new THREE.Color(0x4dccff);
function buildShip(def) {
  for (const c of [...shipModel.children]) { shipModel.remove(c); c.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  engine.flames = []; engine.glowMats = []; engine.navs = [];
  const std = (c, metal, rough) => new THREE.MeshStandardMaterial({ color: c, metalness: metal, roughness: rough, flatShading: !!def.flat });
  const M = {
    hull: std(def.hull, 0.35, 0.4), dark: std(0x1f2128, 0.5, 0.5),
    accent: new THREE.MeshBasicMaterial({ color: def.accent }),
    canopy: new THREE.MeshStandardMaterial({ color: 0x0a1f33, metalness: 0.8, roughness: 0.08, emissive: 0x0d3550, flatShading: !!def.flat }),
  };
  const P = (geo, mat, pos, rot = [0, 0, 0], scl = [1, 1, 1], parent = shipModel) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.rotation.order = 'YXZ';
    m.rotation.set(rot[0] * Math.PI / 180, rot[1] * Math.PI / 180, rot[2] * Math.PI / 180); m.scale.set(...scl); parent.add(m); return m;
  };
  const G = {
    box: (w, h, d) => new THREE.BoxGeometry(w, h, d), cyl: (rt, rb, h) => new THREE.CylinderGeometry(rt, rb, h, 16),
    cap: (r, l) => new THREE.CapsuleGeometry(r, l, 8, 16), sph: (r) => new THREE.SphereGeometry(r, 18, 12),
    cone: (r, h) => new THREE.CylinderGeometry(0, r, h, 16), tor: (R, t) => new THREE.TorusGeometry(R, t, 10, 40),
    oct: (r) => new THREE.OctahedronGeometry(r, 0),
  };
  def.build(P, G, M);
  engineBase = new THREE.Color(def.flame);
  for (const [x, y, z, r] of def.engines) {
    const gm = new THREE.MeshBasicMaterial({ color: def.flame }); engine.glowMats.push(gm);
    P(G.cyl(r, r, 0.05), gm, [x, y, z - 0.03], [90, 0, 0]);
    const flame = new THREE.Group(); flame.position.set(x, y, z); shipModel.add(flame);
    for (const [k, op, white] of [[1, 0.55, false], [0.5, 0.9, true]]) {
      const cg = new THREE.ConeGeometry(r * k, 1, 14, 1, true); cg.translate(0, -0.5, 0); cg.rotateX(-Math.PI / 2);
      const fm = new THREE.MeshBasicMaterial({ color: white ? 0xffffff : def.flame, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
      flame.add(new THREE.Mesh(cg, fm)); if (!white) engine.glowMats.push(fm);
    }
    const fg = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW_WHITE, color: def.flame, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false }));
    fg.position.set(x, y, z + 0.15); fg.scale.setScalar(r * 6.5); shipModel.add(fg); engine.glowMats.push(fg.material);
    engine.flames.push(flame);
  }
  def.navs.forEach(([x, y, z], i) => {
    const c = i === 0 ? 0xff2020 : 0x20ff40;
    P(G.sph(0.15), new THREE.MeshBasicMaterial({ color: c }), [x, y, z]);
    const ns = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW_WHITE, color: c, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
    ns.position.set(x, y, z); ns.scale.setScalar(2.2); shipModel.add(ns); engine.navs.push(ns.material);
  });
  const zMax = Math.max(...def.engines.map(e => e[2]));
  engine.light = new THREE.PointLight(def.flame, 1, 22, 2); engine.light.position.set(0, 0, zMax + 1.7); shipModel.add(engine.light);
  engine.col.set(def.flame);
  // 発射炎とビーム
  wfx.flashes = def.weapon.muzzles.map(([x, y, z]) => {
    const f = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW_WHITE, color: def.weapon.color, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
    f.position.set(x, y, z); f.scale.setScalar(4); shipModel.add(f); return f;
  });
  wfx.beam = null;
  if (def.weapon.type === 'beam') {
    const [x, y, z] = def.weapon.muzzles[0];
    const g = new THREE.Group(); g.position.set(x, y, z); g.visible = false; shipModel.add(g);
    const bg = new THREE.BoxGeometry(1, 1, 1); bg.translate(0, 0, -0.5);
    g.add(new THREE.Mesh(bg, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false })));
    const outer = new THREE.Mesh(bg, new THREE.MeshBasicMaterial({ color: def.weapon.color, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false }));
    outer.scale.set(3.2, 3.2, 1); g.add(outer);
    g.children[0].scale.set(0.25, 0.25, 1);
    wfx.beam = g;
  }
}
const wfx = { flashes: [], beam: null };

function selectShip(i) {
  shipIndex = (i + SHIPS.length) % SHIPS.length;
  const def = SHIPS[shipIndex];
  Object.assign(CFG, BASE_CFG, def.stats);
  ship.radius = 6 * def.size;
  buildShip(def);
  try { localStorage.setItem('starward-ship', String(shipIndex)); } catch (_) {}
  document.getElementById('sname').textContent = def.name;
  document.getElementById('sclass').textContent = `${def.cls} ・ ${def.weapon.name}　${shipIndex + 1} / ${SHIPS.length}`;
  document.getElementById('sdesc').textContent = def.desc;
  const turn = (CFG.pitchRate + CFG.yawRate + CFG.rollRate / 2) / 3;
  const rows = [
    ['速度', CFG.maxSpeed / 500], ['旋回', turn / 2.1], ['加速', CFG.assistAccel / 240],
    ['ブースト', (CFG.boostMul - 1) / 3 * 0.6 + (CFG.boostRegen / CFG.boostDrain) * 0.25], ['平行移動', CFG.strafeSpeed / 240], ['ワープ', CFG.warpMax / 90000],
  ];
  document.getElementById('stats').innerHTML = rows.map(([l, v]) =>
    `<div class="stat"><span>${l}</span><b><i style="width:${Math.round(clamp(v, 0.06, 1) * 100)}%"></i></b></div>`).join('');
}

// 格納庫（機体選択画面）
const hangar = { ang: 0.6 };
function openHangar() {
  UI.started = false; UI.map = false; UI.help = false;
  releaseTouches(); keys.clear();
  if (document.exitPointerLock && document.pointerLockElement) document.exitPointerLock();
  resetShip(); clearShots();
  document.getElementById('start').hidden = false;
}
function updateHangarCamera(dt) {
  hangar.ang += dt * 0.35;
  const sz = SHIPS[shipIndex].size, d = 17 * sz;
  camera.position.set(ship.pos.x + Math.sin(hangar.ang) * d, ship.pos.y + d * 0.28, ship.pos.z + Math.cos(hangar.ang) * d);
  camera.up.set(0, 1, 0); camera.lookAt(ship.pos);
  camera.fov = CFG.baseFov;
  if (VW > VH * 1.1) camera.setViewOffset(VW, VH, -VW * 0.2, 0, VW, VH);
  else camera.setViewOffset(VW, VH, 0, VH * 0.18, VW, VH);
  sky.position.copy(camera.position);
}

const C_BOOST = new THREE.Color(0xff8c33), C_WARP = new THREE.Color(0x9a66ff);
function updateEngine(dt) {
  engine.t += dt;
  const target = 0.4 + Math.max(ship.throttle, 0) * 3 + ship.boostAmt * 4 + ship.warpAmt * 10;
  engine.len = lerp(engine.len, target, damp(10, dt));
  const tc = engineBase.clone().lerp(C_BOOST, ship.boostAmt).lerp(C_WARP, ship.warpAmt);
  engine.col.lerp(tc, damp(6, dt));
  engine.flames.forEach((f, i) => {
    const fl = 1 + Math.sin(engine.t * 47 + i * 2) * 0.06;
    f.scale.set(1 + ship.boostAmt * 0.3, 1 + ship.boostAmt * 0.3, engine.len * fl);
  });
  engine.glowMats.forEach(m => m.color.copy(engine.col));
  engine.light.color.copy(engine.col);
  engine.light.intensity = 0.6 + Math.max(ship.throttle, 0) * 1.5 + ship.boostAmt * 2 + ship.warpAmt * 3;
  const blink = (engine.t % 1.2) < 0.12 ? 1 : 0;
  engine.navs.forEach(m => m.opacity = blink);
}

function tapAction(a) {

// ---------- 飛行 ----------
let targetIndex = 0;
const startXf = { pos: new V3(), quat: new Q() };

function readRotationInput() {
  let pitch = 0, yaw = 0;

  if (l >= CFG.deadzone) { const k = (l - CFG.deadzone) / (1 - CFG.deadzone) / l; sx = s.x * k; sy = s.y * k; }

    const local = dir.applyQuaternion(ship.quat.clone().invert());

}

function toggleWarp() {

  const n = nearestBody(ship.pos);
  if (n && n.surface < n.body.radius) { showMsg(`ワープ不可: ${n.body.name} の重力圏内`); return; }
  ship.warp = 1; ship.warpT = 0; showMsg('ワープドライブ充填中…');
}

}

  const n = d.divideScalar(l);

  if (vn < 0) {
    ship.vel.addScaledVector(n, -vn * (1 + bounce)).multiplyScalar(0.8);
    if (ship.warp !== 0) exitWarp('衝突によりワープ中断');
    cam.shake = Math.min(cam.shake + clamp(-vn / 120, 0.1, 2), 2.5);
    if (-vn > 60) showMsg(`衝突！ (${Math.round(-vn)} m/s)`, 1.5);

}

function updateShip(dt) {
  const [pi, ya, ro] = readRotationInput();
  // 回転

  ship.ang.lerp(new V3(pi * CFG.pitchRate * rs, ya * CFG.yawRate * rs, ro * CFG.rollRate * rs), damp(CFG.rotResp, dt));
  ship.quat.multiply(tmpQ.setFromAxisAngle(AX, ship.ang.x * dt));
  ship.quat.multiply(tmpQ.setFromAxisAngle(AY, ship.ang.y * dt));
  ship.quat.multiply(tmpQ.setFromAxisAngle(AZ, ship.ang.z * dt));
  ship.quat.normalize();
  // スロットル・ブースト
  ship.throttle = clamp(ship.throttle + axis('throttle_down', 'throttle_up') * CFG.throttleRate * dt, -CFG.reverse, 1);
  const wantBoost = held('boost') && ship.throttle > 0 && ship.warp === 0;
  if (wantBoost && ship.boostE > 0) { ship.boosting = true; ship.boostE = Math.max(ship.boostE - CFG.boostDrain * dt, 0); }
  else { ship.boosting = false; if (!held('boost')) ship.boostE = Math.min(ship.boostE + CFG.boostRegen * dt, 1); }
  // ワープ
  if (ship.warp === 1) {
    ship.warpT += dt;
    if (ship.warpT >= CFG.warpSpool) { ship.warp = 2; ship.warpSpeed = Math.max(ship.vel.length(), CFG.maxSpeed); showMsg('ワープ！'); }
  } else if (ship.warp === 2) {
    const n = nearestBody(ship.pos);
    let limit = CFG.warpMax;
    if (n) {
      limit = clamp(n.surface * 0.7, 400, CFG.warpMax);
      if (n.surface < n.body.radius * 0.5) exitWarp(`重力井戸に捕捉 — ${n.body.name} 付近でワープ離脱`);
    }
    if (ship.warp === 2) {
      if (ship.warpSpeed < limit) ship.warpSpeed = Math.min(ship.warpSpeed + CFG.warpAccel * dt, limit);

  // 並進

    const cap = CFG.maxSpeed * (ship.boosting ? CFG.boostMul : 1);
    if (ship.fa) {
      const desired = fwd.clone().multiplyScalar(ship.throttle * cap).addScaledVector(right, sx * CFG.strafeSpeed).addScaledVector(up, sy * CFG.strafeSpeed);

      if (ship.vel.length() > cap * 1.2) ship.vel.setLength(cap * 1.2);
    }
  }

  // 衝突
  for (const b of bodies) pushOut(b.node.position, b.radius + ship.radius, 0.4);
  if (ship.warp !== 2) collideAsteroids(ship.pos, ship.radius, (c, r) => pushOut(c, r + ship.radius, 0.5));

  ship.boostAmt = lerp(ship.boostAmt, ship.boosting ? 1 : 0, damp(6, dt));

}

// ---------- カメラ ----------
const cam = { mode: 0, shake: 0, q: new Q(), init: false };
const CAM_OFF = [new V3(0, 3.4, 15), new V3(0, 8, 36), new V3(0, 0.95, -3.3)];
const CAM_SMOOTH = [7, 4.5, 40];
function updateCamera(dt) {
  if (!cam.init) { cam.q.copy(ship.quat); cam.init = true; }
  cam.q.slerp(ship.quat, damp(CAM_SMOOTH[cam.mode], dt));
  const sr = clamp(ship.vel.length() / 750, 0, 1);
  const def = SHIPS[shipIndex];
  const off = cam.mode === 2 ? new V3(...def.cockpit) : CAM_OFF[cam.mode].clone().multiplyScalar(def.size);
  if (cam.mode !== 2) off.z += sr * 3 + ship.boostAmt * 2;
  const pos = ship.pos.clone().add(off.applyQuaternion(cam.q));
  const s = cam.shake + (ship.warp === 1 ? 0.15 : 0) + ship.warpAmt * 0.05;
  const up = AY.clone().applyQuaternion(cam.q);
  if (s > 0) pos.add(new V3((Math.random() * 2 - 1) * s * 0.4, (Math.random() * 2 - 1) * s * 0.4, 0).applyQuaternion(cam.q));
  cam.shake = Math.max(cam.shake - dt * 2.5, 0);

// ---------- 宇宙塵 ----------
const DUST_N = 360, DUST_EXT = 260;
const dustPos = new Float32Array(DUST_N * 6), dustCol = new Float32Array(DUST_N * 6), dustPts = [];
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('color', new THREE.BufferAttribute(dustCol, 3));
const dust = new THREE.LineSegments(dustGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
dust.frustumCulled = false; scene.add(dust);
function initDust(c) { for (let i = 0; i < DUST_N; i++) dustPts.push(new V3((Math.random() * 2 - 1) * DUST_EXT, (Math.random() * 2 - 1) * DUST_EXT, (Math.random() * 2 - 1) * DUST_EXT).add(c)); }
const wrap = (v, e) => ((v + e) % (2 * e) + 2 * e) % (2 * e) - e;
function updateDust() {
  const c = camera.position, spd = ship.vel.length();
  const dir = spd > 1 ? ship.vel.clone().divideScalar(spd) : fwdOf(ship.quat);
  const len = clamp(spd * 0.015, 0.5, 80);
  for (let i = 0; i < dustPts.length; i++) {
    const p = dustPts[i];
    p.set(wrap(p.x - c.x, DUST_EXT) + c.x, wrap(p.y - c.y, DUST_EXT) + c.y, wrap(p.z - c.z, DUST_EXT) + c.z);
    const f = clamp(1 - p.distanceTo(c) / DUST_EXT, 0, 1) * 0.8;
    const j = i * 6;
    dustPos[j] = p.x; dustPos[j + 1] = p.y; dustPos[j + 2] = p.z;
    dustPos[j + 3] = p.x - dir.x * len; dustPos[j + 4] = p.y - dir.y * len; dustPos[j + 5] = p.z - dir.z * len;
    dustCol[j] = 0.75 * f; dustCol[j + 1] = 0.85 * f; dustCol[j + 2] = f;
    dustCol[j + 3] = dustCol[j + 4] = dustCol[j + 5] = 0;
  }
  dustGeo.attributes.position.needsUpdate = true; dustGeo.attributes.color.needsUpdate = true;
}

// ===================== HUD =====================
const hud = document.getElementById('hud');
const ctx = hud.getContext('2d');
let VW = 1, VH = 1, DPR = 1, S = 1;
const COL = { main: 'rgba(115,227,255,0.92)', dim: 'rgba(115,227,255,0.38)', warn: 'rgba(255,90,70,0.95)', target: 'rgba(255,207,74,0.95)', gate: 'rgba(255,140,38,0.95)', pro: 'rgba(120,255,140,0.9)', warp: 'rgba(180,155,255,0.95)', fill: 'rgba(115,227,255,0.12)', active: 'rgba(115,227,255,0.45)', text: 'rgba(232,248,255,0.95)' };

function text(x, y, s, size, col, align = 'left') {

  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillText(s, x + 1, y + 1);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
const fmtDist = (d) => d >= 1000 ? (d / 1000).toFixed(1) + ' km' : Math.round(d) + ' m';
const fmtTime = (t) => t > 3600 ? '--:--' : `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

function project(p) {
  const v = p.clone().applyMatrix4(camera.matrixWorldInverse);
  const behind = v.z > 0;
  const n = p.clone().project(camera);
  return { x: (n.x * 0.5 + 0.5) * VW, y: (-n.y * 0.5 + 0.5) * VH, behind, local: v };
}
function marker(p, label, col, dy = 0) {

// ---------- タッチ操作 ----------
const touches = new Map();  // pointerId -> {role, ox, oy, x, y}

function layout() {
  const s = S, w = VW, h = VH;
  slider = { x: w - 16 - 44 * s, y: h * 0.3, w: 44 * s, h: h * 0.7 - 16 * s };
  const bx = slider.x - 58 * s;
  buttons = [
    { id: 'fire', label: 'FIRE', x: bx, y: h - 52 * s, r: 38 * s, action: 'fire', hold: true },
    { id: 'boost', label: 'BOOST', x: bx - 88 * s, y: h - 40 * s, r: 29 * s, action: 'boost', hold: true },
    { id: 'warp', label: 'WARP', x: bx, y: h - 142 * s, r: 26 * s, action: 'warp', hold: false },
    { id: 'align', label: '自動旋回', x: bx - 88 * s, y: h - 120 * s, r: 26 * s, action: 'align', hold: true },
    { id: 'roll_l', label: '↺', x: 16 + 26 * s, y: h - 168 * s, r: 23 * s, action: 'roll_left', hold: true },
    { id: 'roll_r', label: '↻', x: 16 + 82 * s, y: h - 168 * s, r: 23 * s, action: 'roll_right', hold: true },
    { id: 'up', label: '▲', x: 16 + 140 * s, y: h - 168 * s, r: 20 * s, action: 'strafe_up', hold: true },
    { id: 'down', label: '▼', x: 16 + 188 * s, y: h - 168 * s, r: 20 * s, action: 'strafe_down', hold: true },
  ];
  const top = ['map:MAP', 'target_next:TGT', 'camera_mode:CAM', 'flight_assist:FA', 'reset:↩', 'help:?'];
  top.forEach((t, i) => { const [a, l] = t.split(':'); buttons.push({ id: a, label: l, x: w - 16 - 20 * s - i * 48 * s, y: 12 + 20 * s, r: 19 * s, action: a, hold: false }); });
}
function pressHold(a) { touchHeld.set(a, (touchHeld.get(a) || 0) + 1); }

}

hud.addEventListener('pointerdown', (e) => {

    const mb = buttons.find(b => b.id === 'map');
    if (UI.touch && mb && Math.hypot(mx - mb.x, my - mb.y) <= mb.r * 1.2) { UI.map = false; return; }
    mapTap(mx, my); return;
  }
  if (!UI.touch) {
    if (document.pointerLockElement === hud) { if (e.button === 0 && !WS.mouseFire) { WS.mouseFire = true; pressHold('fire'); } return; }
    if (hud.requestPointerLock && document.pointerLockElement !== hud) { try { const r = hud.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (_) {} }
    return;
  }

}, { passive: false });

function drawTouchUI() {
  // スティック
  let drawn = false;
  for (const t of touches.values()) if (t.role === 'stick') {
    const R = 60 * S; circle(t.ox, t.oy, R, COL.fill, COL.dim);
    const dx = t.x - t.ox, dy = t.y - t.oy, l = Math.hypot(dx, dy), k = l > R ? R / l : 1;
    circle(t.ox + dx * k, t.oy + dy * k, 24 * S, COL.active); drawn = true;
  }
  if (!drawn) {
    const hx = 16 + 100 * S, hy = VH - 74 * S;
    circle(hx, hy, 60 * S, 'rgba(115,227,255,0.04)', 'rgba(115,227,255,0.18)');
    text(hx, hy + 4 * S, 'ドラッグで旋回', 11 * S, 'rgba(232,248,255,0.4)', 'center');
  }
  // スロットル
  const s = slider, rev = CFG.reverse;
  ctx.fillStyle = COL.fill; ctx.fillRect(s.x, s.y, s.w, s.h);
  ctx.strokeStyle = COL.dim; ctx.lineWidth = 2; ctx.strokeRect(s.x, s.y, s.w, s.h);
  const zy = s.y + s.h * (1 - rev / (1 + rev));
  line(s.x - 6, zy, s.x + s.w + 6, zy, COL.main, 2);
  const ty = s.y + s.h * (1 - (ship.throttle + rev) / (1 + rev));
  ctx.fillStyle = ship.throttle >= 0 ? COL.active : 'rgba(255,90,70,0.45)';
  ctx.fillRect(s.x, Math.min(ty, zy), s.w, Math.abs(zy - ty));
  ctx.fillStyle = COL.text; ctx.fillRect(s.x - 5, ty - 4, s.w + 10, 8);
  text(s.x + s.w / 2, s.y - 8, 'THR', 12 * S, COL.text, 'center');
  // ボタン
  for (const b of buttons) {
    let pressed = false; for (const t of touches.values()) if (t.role === b.id) pressed = true;
    if (b.id === 'flight_assist' && !ship.fa) pressed = true;
    circle(b.x, b.y, b.r, pressed ? (b.id === 'fire' ? 'rgba(255,90,70,0.45)' : COL.active) : 'rgba(2,8,18,0.35)', b.id === 'fire' ? COL.warn : COL.dim);
    const fs = b.label.length <= 2 ? (b.label.length === 1 ? 22 : 14) : (b.r > 30 * S ? 14 : 11);
    text(b.x, b.y + fs * S * 0.36, b.label, fs * S, COL.text, 'center');
  }
}

function drawHUD() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  if (!UI.started) return;
  const cx = VW / 2, cy = VH / 2, k = S;
  // クロスヘア
  line(cx - 13 * k, cy, cx - 5 * k, cy, COL.main); line(cx + 5 * k, cy, cx + 13 * k, cy, COL.main); line(cx, cy + 5 * k, cx, cy + 11 * k, COL.main);
  if (!UI.touch && document.pointerLockElement === hud) {
    const r = 100 * k; circle(cx, cy, r, null, COL.dim, 1.5);
    const px = cx + ship.steer.x * r, py = cy + ship.steer.y * r; line(cx, cy, px, py, COL.dim, 1.5); circle(px, py, 5, COL.main);
  }
  // 射撃照準（機首方向 700m 先）
  {
    const W = SHIPS[shipIndex].weapon;
    const gp = project(ship.pos.clone().addScaledVector(fwdOf(ship.quat), 700));
    if (!gp.behind) {
      const r = 7 * k, c = W.type === 'missile' ? COL.target : 'rgba(255,120,100,0.9)';
      ctx.beginPath(); ctx.moveTo(gp.x, gp.y - r); ctx.lineTo(gp.x + r, gp.y); ctx.lineTo(gp.x, gp.y + r); ctx.lineTo(gp.x - r, gp.y); ctx.closePath();
      ctx.strokeStyle = c; ctx.lineWidth = 1.5; ctx.stroke();
      if (WS.hitT > 0) for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) line(gp.x + sx * 9 * k, gp.y + sy * 9 * k, gp.x + sx * 15 * k, gp.y + sy * 15 * k, 'rgba(255,255,255,0.95)', 2);
      // ミサイルのロック候補
      if (W.type === 'missile') {
        const ti = pickTarget(fwdOf(ship.quat), ship.pos);
        if (ti >= 0) { const tp = project(astPos[ti]); if (!tp.behind) { const q = 12 * k; ctx.strokeStyle = COL.target; ctx.lineWidth = 1.5; ctx.strokeRect(tp.x - q, tp.y - q, q * 2, q * 2); text(tp.x + q + 4, tp.y - q, 'LOCK', 10 * k, COL.target); } }
      }
    }
  }
  // 進行方向
  if (ship.vel.length() > 5) {
    const pr = project(camera.position.clone().addScaledVector(ship.vel.clone().normalize(), 5000));
    if (!pr.behind) {
      circle(pr.x, pr.y, 8 * k, null, COL.pro);
      line(pr.x - 15 * k, pr.y, pr.x - 8 * k, pr.y, COL.pro); line(pr.x + 8 * k, pr.y, pr.x + 15 * k, pr.y, COL.pro); line(pr.x, pr.y - 8 * k, pr.x, pr.y - 14 * k, COL.pro);
    }
  }
  if (!G.finished && G.index < gates.length) marker(gates[G.index].mesh.position, `GATE ${G.index + 1}/${gates.length}`, COL.gate, -18);
  const tg = bodies[targetIndex];
  const td = Math.max(tg.node.position.distanceTo(ship.pos) - tg.radius, 0);
  marker(tg.node.position, `${tg.name}  ${fmtDist(td)}`, COL.target);

  // ステータス
  const top = UI.touch;
  let x = 16, y = top ? 10 + 20 * k : VH - 150 * k;
  text(x, y, 'SPEED', 11 * k, COL.dim);
  text(x, y + 28 * k, `${Math.round(ship.vel.length())} m/s`, 26 * k, COL.main);
  const bw = 170 * k, by = y + 42 * k, rev = CFG.reverse;
  ctx.strokeStyle = COL.dim; ctx.lineWidth = 1.5; ctx.strokeRect(x, by, bw, 8 * k);
  const zx = x + bw * (rev / (1 + rev)); line(zx, by - 3, zx, by + 8 * k + 3, COL.main, 1.5);
  const tw = bw / (1 + rev) * ship.throttle;
  ctx.fillStyle = ship.throttle >= 0 ? COL.main : COL.warn; ctx.fillRect(Math.min(zx, zx + tw), by, Math.abs(tw), 8 * k);
  text(x + bw + 8, by + 8 * k, `THR ${Math.round(ship.throttle * 100)}%`, 11 * k, COL.main);
  const by2 = by + 18 * k;
  ctx.strokeStyle = COL.dim; ctx.strokeRect(x, by2, bw, 5 * k);
  ctx.fillStyle = 'rgba(255,150,60,0.9)'; ctx.fillRect(x, by2, bw * ship.boostE, 5 * k);
  text(x + bw + 8, by2 + 6 * k, 'BOOST', 10 * k, 'rgba(255,150,60,0.95)');
  const by3 = by2 + 24 * k;
  text(x, by3, ship.fa ? 'FA: ON' : 'FA: OFF', 12 * k, ship.fa ? COL.main : COL.warn);
  text(x + 70 * k, by3, ['WARP: 待機', 'WARP: 充填中', 'WARP: 航行中'][ship.warp], 12 * k, ship.warp ? COL.warp : COL.dim);
  if (ship.aligning) text(x + 175 * k, by3, 'AUTO-ALIGN', 12 * k, COL.target);
  text(x, by3 + 18 * k, `${SHIPS[shipIndex].weapon.name}　撃破 ${WS.score}`, 12 * k, 'rgba(255,140,120,0.95)');

  // ターゲット
  const tx = top ? Math.max(16 + 260 * k, VW * 0.34) : VW - 16 - 250 * k;
  const ty0 = top ? 10 + 20 * k : VH - 150 * k;
  const dir = tg.node.position.clone().sub(ship.pos).normalize(), closing = ship.vel.dot(dir);
  text(tx, ty0, top ? 'TARGET' : 'TARGET  (T: 切替 / Y長押し: 自動旋回)', 11 * k, COL.dim);
  text(tx, ty0 + 24 * k, tg.name, 20 * k, COL.target);
  text(tx, ty0 + 44 * k, `距離 ${fmtDist(td)}`, 13 * k, COL.main);
  text(tx, ty0 + 62 * k, `接近 ${Math.round(closing)} m/s   ETA ${closing > 1 ? fmtTime(td / closing) : '--:--'}`, 13 * k, COL.main);

  else text(gx, gy + 22 * k, `${G.index} / ${gates.length}   ${G.time.toFixed(2)} 秒`, 17 * k, COL.gate);
  if (G.best > 0) text(gx, gy + 40 * k, `ベスト ${G.best.toFixed(2)} 秒`, 12 * k, COL.main);

  const nb = nearestBody(ship.pos);
  if (nb) {
    const cl = ship.vel.dot(nb.body.node.position.clone().sub(ship.pos).normalize());
    if (nb.surface < 600 && cl > 20 && Math.floor(performance.now() / 250) % 2 === 0)
      text(cx, cy - 90 * k, `⚠ 近接警告  ${nb.body.name}  高度 ${fmtDist(nb.surface)}`, 18 * k, COL.warn, 'center');
  }

  if (ship.warp === 1) {

    ctx.strokeStyle = COL.dim; ctx.strokeRect(cx - w / 2, cy + 60 * k, w, 6 * k);
    ctx.fillStyle = COL.warp; ctx.fillRect(cx - w / 2, cy + 60 * k, w * r, 6 * k);
    text(cx, cy + 54 * k, 'WARP CHARGING', 12 * k, COL.warp, 'center');
  }
  // メッセージ
  if (UI.msgT > 0) text(cx, top ? VH * 0.3 : 80 * k, UI.msg, 18 * k, `rgba(255,255,255,${clamp(UI.msgT, 0, 1)})`, 'center');

  if (UI.map) { drawMap(); if (UI.touch) { const mb = buttons.find(b => b.id === 'map'); circle(mb.x, mb.y, mb.r, COL.active, COL.dim); text(mb.x, mb.y + 4 * S, 'MAP', 11 * S, COL.text, 'center'); } return; }
  if (UI.touch) drawTouchUI();
  else if (document.pointerLockElement !== hud) text(cx, cy + 120 * k, 'クリックでマウス操縦（Esc で解除）', 16 * k, 'rgba(255,255,255,0.85)', 'center');
  if (VH > VW * 1.05) text(cx, VH * 0.45, '横向きにすると遊びやすくなります', 15 * k, COL.target, 'center');
  if (UI.help) drawHelp();
}

// ---------- 星系マップ（距離は平方根スケール） ----------
let mapPts = [];
function mapGeom() {
  const top = UI.touch ? 64 * S : 16, R = Math.max(60, Math.min(VW * 0.5 - 24, (VH - top - 16) * 0.5));
  return { cx: VW / 2, cy: top + (VH - top - 16) / 2, R };
}
const mapR = (d, R) => Math.sqrt(Math.max(d, 0) / SYSTEM_RADIUS) * R;
function mapXY(p, g) { const d = Math.hypot(p.x, p.z), r = mapR(d, g.R), a = Math.atan2(p.z, p.x); return [g.cx + Math.cos(a) * r, g.cy + Math.sin(a) * r]; }
function drawMap() {
  const g = mapGeom(), k = S;
  ctx.fillStyle = 'rgba(1,5,14,0.86)'; ctx.fillRect(0, 0, VW, VH);
  // 小惑星帯
  for (const [a, b] of [[BELT_INNER, BELT_OUTER], [OUTER_INNER, OUTER_OUTER]]) {
    ctx.beginPath(); ctx.arc(g.cx, g.cy, (mapR(a, g.R) + mapR(b, g.R)) / 2, 0, TAU);
    ctx.strokeStyle = 'rgba(180,160,140,0.22)'; ctx.lineWidth = Math.max(3, mapR(b, g.R) - mapR(a, g.R)); ctx.stroke();
  }
  mapPts = [];
  for (const b of bodies) {
    if (!b.parent && b.orbit) circle(g.cx, g.cy, mapR(b.orbit, g.R), null, 'rgba(115,227,255,0.14)', 1);
  }
  bodies.forEach((b, i) => {
    let [x, y] = mapXY(b.node.position, g);
    if (b.parent) {
      // 衛星は親の周りに少し離して描く
      const pp = findBody(b.parent).node.position, [px, py] = mapXY(pp, g);
      const a = Math.atan2(b.node.position.z - pp.z, b.node.position.x - pp.x);
      x = px + Math.cos(a) * 14 * k; y = py + Math.sin(a) * 14 * k;
    }
    const sel = i === targetIndex;
    const rad = b.parent ? 2.5 * k : clamp(Math.sqrt(b.radius) / 14, 3, 8) * k;
    circle(x, y, rad, i === 0 ? '#ffcf6a' : (b.parent ? 'rgba(200,210,220,0.8)' : 'rgba(170,220,255,0.95)'));
    if (sel) circle(x, y, rad + 6 * k, null, COL.target, 2);
    if (!b.parent || sel) text(x + rad + 4 * k, y + 4 * k, b.name, (b.parent ? 10 : 11.5) * k, sel ? COL.target : 'rgba(232,248,255,0.85)');
    mapPts.push({ i, x, y });
  });
  // 自機
  const [sx, sy] = mapXY(ship.pos, g), f = fwdOf(ship.quat), fa = Math.atan2(f.z, f.x);
  ctx.beginPath();
  ctx.moveTo(sx + Math.cos(fa) * 9 * k, sy + Math.sin(fa) * 9 * k);
  ctx.lineTo(sx + Math.cos(fa + 2.5) * 6 * k, sy + Math.sin(fa + 2.5) * 6 * k);
  ctx.lineTo(sx + Math.cos(fa - 2.5) * 6 * k, sy + Math.sin(fa - 2.5) * 6 * k);
  ctx.closePath(); ctx.fillStyle = COL.pro; ctx.fill();
  text(16, VH - 14, UI.touch ? '天体をタップで目的地に設定 / MAP で閉じる' : '天体をクリックで目的地に設定 / M で閉じる', 12 * k, COL.dim);
  text(VW - 16, VH - 14, `星系半径 ${fmtDist(SYSTEM_RADIUS)}`, 12 * k, COL.dim, 'right');
}
function mapTap(x, y) {
  let best = null, bd = 30 * S;
  for (const p of mapPts) { const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = p; } }
  if (best) { targetIndex = best.i; UI.map = false; showMsg('目的地: ' + bodies[best.i].name + '（自動旋回で向けます）', 2.5); }
}

function resize() {
  const r = document.getElementById('wrap').getBoundingClientRect();
  VW = Math.max(1, r.width); VH = Math.max(1, r.height); DPR = Math.min(window.devicePixelRatio || 1, 2);
  S = clamp(Math.min(VW, VH) / 400, 0.72, 1.45);
  renderer.setSize(VW, VH, false);
  hud.width = Math.round(VW * DPR); hud.height = Math.round(VH * DPR);
  camera.aspect = VW / VH; camera.updateProjectionMatrix();
  layout();
}
addEventListener('resize', resize);

// ===================== 武装システム =====================
const shots = [];
const ZAXIS = new V3(0, 0, 1), ZERO_M = new THREE.Matrix4().makeScale(0, 0, 0);
const boltGeo = new THREE.BoxGeometry(0.3, 0.3, 1);
const missileGeo = new THREE.BoxGeometry(0.45, 0.45, 2.4);
const matCache = {};
const addMat = (c) => matCache[c] || (matCache[c] = new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false }));
const glowCache = {};
const glowMat = (c) => glowCache[c] || (glowCache[c] = new THREE.SpriteMaterial({ map: GLOW_WHITE, color: c, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
const WS = { cd: 0, muzzle: 0, burstLeft: 0, burstT: 0, score: 0, hitT: 0, sparkT: 0, mouseFire: false };
let nearIdx = [], nearT = 0;

function refreshNear() {
  nearIdx = [];
  for (let i = 0; i < astPos.length; i++) {
    if (!astAlive[i]) continue;
    const rr = 5200 + astRad[i];
    if (ship.pos.distanceToSquared(astPos[i]) < rr * rr) nearIdx.push(i);
  }
}
function restoreAsteroids() {
  if (!astMesh) return;
  for (let i = 0; i < astPos.length; i++) if (!astAlive[i]) { astAlive[i] = 1; astMesh.setMatrixAt(i, astMats[i]); }
  astHP = Float32Array.from(astRad, r => Math.max(1, r / 12));
  astMesh.instanceMatrix.needsUpdate = true;
}
function damageAsteroid(i, d, point, spark = true) {
  if (!astAlive[i]) return;
  astHP[i] -= d; WS.hitT = 0.12;
  if (spark) spawnFlash(point, 6, 0xffd6a0, 0.18);
  if (astHP[i] <= 0) {
    astAlive[i] = 0; astMesh.setMatrixAt(i, ZERO_M); astMesh.instanceMatrix.needsUpdate = true;
    explode(astPos[i], astRad[i]); WS.score++;
    nearIdx = nearIdx.filter(j => j !== i);
  }
}
function splashDamage(point, R, dmg) {
  explode(point, R * 0.5, 0xffc060);
  for (const i of [...nearIdx]) if (astAlive[i] && point.distanceTo(astPos[i]) < R + astRad[i]) damageAsteroid(i, dmg, point, false);
}
// 線分と球の交差（最初に当たる位置の割合 0..1、外れは -1）
function segSphere(a, b, c, r) {
  const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z, fx = a.x - c.x, fy = a.y - c.y, fz = a.z - c.z;
  const A = dx * dx + dy * dy + dz * dz, B = 2 * (fx * dx + fy * dy + fz * dz), C = fx * fx + fy * fy + fz * fz - r * r;
  if (C <= 0) return 0;
  const disc = B * B - 4 * A * C; if (disc < 0 || A === 0) return -1;
  const t = (-B - Math.sqrt(disc)) / (2 * A);
  return t >= 0 && t <= 1 ? t : -1;
}
// 半直線と球（距離、外れは -1）
function raySphere(o, d, c, r) {
  const ox = o.x - c.x, oy = o.y - c.y, oz = o.z - c.z;
  const b = ox * d.x + oy * d.y + oz * d.z, cc = ox * ox + oy * oy + oz * oz - r * r;

}
const muzzleWorld = (m) => new V3(m[0], m[1], m[2]).applyQuaternion(ship.quat).add(ship.pos);

function pickTarget(dir, from) {
  let best = -1, bestA = 0.42;
  for (const i of nearIdx) {
    if (!astAlive[i]) continue;
    const v = astPos[i].clone().sub(from), d = v.length();
    if (d > 3500 || d < 1) continue;
    const a = Math.acos(clamp(v.dot(dir) / d, -1, 1));
    if (a < bestA) { bestA = a; best = i; }
  }

}
function spawnShot(W, origin, dir) {
  let mesh;
  if (W.type === 'missile') {
    mesh = new THREE.Mesh(missileGeo, addMat(0xffffff));
    const g = new THREE.Sprite(glowMat(W.color)); g.scale.setScalar(5); g.position.z = -1.6; mesh.add(g);
  } else {
    mesh = new THREE.Mesh(boltGeo, addMat(W.color));
    mesh.scale.set(W.size || 1, W.size || 1, W.len || 8);
    // 後方から見ても弾が分かるように光の玉を付ける（親の伸縮を打ち消す）
    const g = new THREE.Sprite(glowMat(W.color)); const gs = 3.2 * (W.size || 1);
    g.scale.set(gs / (W.size || 1), gs / (W.size || 1), 1); mesh.add(g);
  }
  mesh.position.copy(origin); scene.add(mesh);
  const v0 = W.type === 'missile' ? Math.max(ship.vel.dot(dir), 0) + 250 : W.speed;
  const vel = dir.clone().multiplyScalar(v0);
  if (W.type !== 'missile') vel.add(ship.vel);
  shots.push({ mesh, pos: origin.clone(), vel, life: W.life || 1.6, W, target: W.type === 'missile' ? pickTarget(dir, origin) : -1, hit: new Set() });
}
function fireOnce(W) {
  const fwd = fwdOf(ship.quat), right = AX.clone().applyQuaternion(ship.quat), up = AY.clone().applyQuaternion(ship.quat);
  const idx = W.together ? W.muzzles.map((_, i) => i) : [WS.muzzle++ % W.muzzles.length];
  for (const mi of idx) {
    const origin = muzzleWorld(W.muzzles[mi]);
    if (wfx.flashes[mi]) wfx.flashes[mi].material.opacity = 1;
    const n = W.pellets || 1;
    for (let k = 0; k < n; k++) {
      const dir = fwd.clone();
      if (W.fan) dir.addScaledVector(right, (k - (n - 1) / 2) * W.fan);
      if (W.spread) dir.addScaledVector(right, (Math.random() * 2 - 1) * W.spread).addScaledVector(up, (Math.random() * 2 - 1) * W.spread);
      spawnShot(W, origin, dir.normalize());
    }
  }
}
function clearShots() {
  for (const p of shots) scene.remove(p.mesh);
  shots.length = 0;
  if (wfx.beam) wfx.beam.visible = false;
}

function updateBeam(dt, firing, W) {
  const g = wfx.beam; if (!g) return;
  g.visible = firing;
  if (!firing) return;
  const o = muzzleWorld(W.muzzles[0]), d = fwdOf(ship.quat);
  let len = W.range, hit = -1;
  for (const i of nearIdx) {
    if (!astAlive[i]) continue;
    const t = raySphere(o, d, astPos[i], astRad[i]);
    if (t >= 0 && t < len) { len = t; hit = i; }
  }
  let body = false;
  for (const b of bodies) { const t = raySphere(o, d, b.node.position, b.radius); if (t >= 0 && t < len) { len = t; hit = -1; body = true; } }
  const fl = 1 + Math.sin(performance.now() * 0.05) * 0.15;
  g.scale.set(fl, fl, Math.max(len, 0.1));
  WS.sparkT -= dt;
  const point = o.clone().addScaledVector(d, len);
  if (hit >= 0) {
    damageAsteroid(hit, W.dps * dt, point, false);
    if (WS.sparkT <= 0) { spawnFlash(point, 10, W.color, 0.2); WS.sparkT = 0.07; }
  } else if (body && WS.sparkT <= 0) { spawnFlash(point, 14, W.color, 0.2); WS.sparkT = 0.07; }
}

function updateWeapons(dt) {
  const W = SHIPS[shipIndex].weapon;
  WS.cd -= dt; WS.hitT = Math.max(WS.hitT - dt, 0);
  nearT -= dt; if (nearT <= 0) { refreshNear(); nearT = 0.2; }
  const firing = held('fire') && ship.warp !== 2;
  if (W.type === 'beam') updateBeam(dt, firing, W);
  else {
    if (firing && WS.cd <= 0) { fireOnce(W); WS.cd = 1 / W.rate; if (W.burst) { WS.burstLeft = W.burst - 1; WS.burstT = 0.06; } }
    if (WS.burstLeft > 0) { WS.burstT -= dt; if (WS.burstT <= 0) { fireOnce(W); WS.burstLeft--; WS.burstT = 0.06; } }
  }
  for (const f of wfx.flashes) f.material.opacity = Math.max(f.material.opacity - dt * 14, 0);

  for (let s = shots.length - 1; s >= 0; s--) {
    const p = shots[s]; p.life -= dt;
    if (p.W.type === 'missile') {
      const sp = Math.min(p.vel.length() + 1100 * dt, p.W.speed);
      const dir = p.vel.clone().normalize();
      if (p.target >= 0 && astAlive[p.target]) dir.lerp(astPos[p.target].clone().sub(p.pos).normalize(), Math.min(1, 4.5 * dt)).normalize();
      p.vel.copy(dir).multiplyScalar(sp);
    }
    const from = p.pos.clone();
    p.pos.addScaledVector(p.vel, dt);
    let hit = -1, ht = 2;
    const pad = p.W.type === 'missile' ? 4 : 1;
    for (const i of nearIdx) {
      if (!astAlive[i] || p.hit.has(i)) continue;
      const t = segSphere(from, p.pos, astPos[i], astRad[i] + pad);
      if (t >= 0 && t < ht) { ht = t; hit = i; }
    }
    let dead = p.life <= 0;
    if (hit >= 0) {
      const point = from.clone().lerp(p.pos, ht);
      if (p.W.type === 'missile') { splashDamage(point, p.W.splash, p.W.dmg); dead = true; }
      else { damageAsteroid(hit, p.W.dmg, point); if (p.W.pierce) p.hit.add(hit); else dead = true; }
    } else {
      for (const b of bodies) if (p.pos.distanceToSquared(b.node.position) < b.radius * b.radius) { spawnFlash(p.pos, 12, p.W.color, 0.25); dead = true; break; }
      if (dead && p.life <= 0 && p.W.type === 'missile') explode(p.pos, 20, 0xffc060);
    }
    if (dead) { scene.remove(p.mesh); shots.splice(s, 1); continue; }
    p.mesh.position.copy(p.pos);
    p.mesh.quaternion.setFromUnitVectors(ZAXIS, p.vel.clone().normalize());
  }
  updateFx(dt);
}

// ---------- 爆発・火花 ----------
const flashPool = [], debrisPool = [];
let flashI = 0, debrisI = 0;
for (let i = 0; i < 40; i++) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW_WHITE, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
  sp.visible = false; scene.add(sp); flashPool.push({ sp, life: 0, max: 1, size: 1 });
}
for (let i = 0; i < 10; i++) {
  const n = 24, g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const m = new THREE.PointsMaterial({ color: 0xffb070, size: 4, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
  const pts = new THREE.Points(g, m); pts.frustumCulled = false; pts.visible = false; scene.add(pts);
  debrisPool.push({ pts, vel: new Float32Array(n * 3), life: 0, max: 1 });
}
function spawnFlash(pos, size, color, life) {
  const f = flashPool[flashI++ % flashPool.length];
  f.sp.position.copy(pos); f.sp.material.color.set(color); f.sp.visible = true;
  f.life = f.max = life; f.size = size;
}
function explode(pos, r, color = 0xffa050) {
  spawnFlash(pos, r * 4 + 20, color, 0.6);
  spawnFlash(pos, r * 2 + 10, 0xffffff, 0.25);
  const d = debrisPool[debrisI++ % debrisPool.length];
  const a = d.pts.geometry.attributes.position;
  for (let i = 0; i < a.count; i++) {
    a.setXYZ(i, pos.x, pos.y, pos.z);
    const v = new V3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1).normalize().multiplyScalar((0.6 + Math.random()) * (r * 1.2 + 30));
    d.vel[i * 3] = v.x; d.vel[i * 3 + 1] = v.y; d.vel[i * 3 + 2] = v.z;
  }
  a.needsUpdate = true;
  d.pts.material.size = Math.max(2, r * 0.18); d.pts.material.color.set(color);
  d.pts.visible = true; d.life = d.max = 1.4;
  if (ship.pos.distanceTo(pos) < r * 6 + 300) cam.shake = Math.min(cam.shake + 0.25, 2.5);
}
function updateFx(dt) {
  for (const f of flashPool) {
    if (!f.visible && f.life <= 0) continue;
    f.life -= dt;
    if (f.life <= 0) { f.sp.visible = false; continue; }
    const t = f.life / f.max;
    f.sp.material.opacity = t; f.sp.scale.setScalar(f.size * (1.4 - t * 0.4));
  }
  for (const d of debrisPool) {
    if (d.life <= 0) continue;
    d.life -= dt;
    if (d.life <= 0) { d.pts.visible = false; continue; }
    const a = d.pts.geometry.attributes.position;
    for (let i = 0; i < a.count; i++) a.setXYZ(i, a.getX(i) + d.vel[i * 3] * dt, a.getY(i) + d.vel[i * 3 + 1] * dt, a.getZ(i) + d.vel[i * 3 + 2] * dt);
    a.needsUpdate = true;
    d.pts.material.opacity = d.life / d.max;
  }
}

let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now;
  updateOrbits(dt);
  if (UI.started) { updateShip(dt); updateGates(dt); updateWeapons(dt); }
  else { shipModel.position.copy(ship.pos); shipModel.quaternion.copy(ship.quat); updateEngine(dt); updateFx(dt); }
  if (UI.started) updateCamera(dt); else updateHangarCamera(dt);
  updateDust();
  UI.msgT = Math.max(UI.msgT - dt, 0);
  renderer.render(scene, camera);
  drawHUD();
  requestAnimationFrame(frame);
}

// ===================== 起動 =====================
(async function boot() {
  const prog = document.getElementById('prog'), go = document.getElementById('go');
  document.getElementById('keys').innerHTML = IS_TOUCH
    ? '<b>左ドラッグ</b> 旋回　<b>右端スライダー</b> スロットル　<b>BOOST / WARP</b> 加速・ワープ　<b>MAP</b> 星系マップ'
    : '<b>マウス</b> 旋回　<b>W/S</b> スロットル　<b>Shift</b> ブースト　<b>Tab</b> ワープ　<b>M</b> 星系マップ　<b>H</b> 操作説明';
  resize();
  // 格納庫はテクスチャ生成中から表示しておく
  const terra = PLANETS.find(p => p.name === 'テラノヴァ');
  startXf.pos.set(Math.cos(terra.angle) * terra.orbit, 400, Math.sin(terra.angle) * terra.orbit + 6000);
  let saved = 0; try { saved = parseInt(localStorage.getItem('starward-ship') || '0', 10) || 0; } catch (_) {}
  selectShip(saved);
  resetShip();
  document.getElementById('prev').addEventListener('click', () => selectShip(shipIndex - 1));
  document.getElementById('next').addEventListener('click', () => selectShip(shipIndex + 1));
  // 機体のスワイプ切替
  let sx0 = null;
  const st = document.getElementById('start');
  st.addEventListener('pointerdown', (e) => { if (e.target === st) sx0 = e.clientX; });
  st.addEventListener('pointerup', (e) => { if (sx0 !== null && Math.abs(e.clientX - sx0) > 40) selectShip(shipIndex + (e.clientX < sx0 ? 1 : -1)); sx0 = null; });
  buildSun();
  initDust(startXf.pos);
  requestAnimationFrame(frame);
  await buildPlanets((r) => { prog.style.width = Math.round(r * 100) + '%'; });
  updateOrbits(0);
  startXf.pos.copy(findBody('テラノヴァ').node.position).add(new V3(0, 400, 6000));
  buildAsteroids(startXf.pos);
  buildGates(startXf.pos);
  resetShip(); resetGates();
  targetIndex = bodies.indexOf(findBody('テラノヴァ'));
  prog.style.width = '100%';
  go.disabled = false; go.textContent = '発進';
  go.addEventListener('click', () => {
    document.getElementById('start').hidden = true;
    camera.clearViewOffset();
    resetShip(); resetGates(); clearShots(); restoreAsteroids(); WS.score = 0; refreshNear();
    UI.started = true; last = performance.now();
    showMsg(`${SHIPS[shipIndex].name} 発進 — ` + (UI.touch ? '右のスライダーを上げて加速' : 'W で加速（クリックでマウス操縦）'), 4);
  });
})();
</script>
