html { height: 100%; box-sizing: border-box; background: var(--void); }

.lede { margin: 0; font-size: 14px; line-height: 1.6; color: rgba(232, 248, 255, 0.75); }

#go {

#go:disabled { opacity: 0.35; cursor: default; }
#go:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
.keys { margin: 0; font-size: 12px; line-height: 1.7; color: rgba(232, 248, 255, 0.6); }

'use strict';
const TAU = Math.PI * 2;
const V3 = THREE.Vector3, Q = THREE.Quaternion;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const hex = (h) => [((h >> 16) & 255) / 255, ((h >> 8) & 255) / 255, (h & 255) / 255];

// ===================== ノイズ =====================
function h3(i, j, k) {
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(k, 1274126177)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1103515245);
  h ^= h >>> 16;
  return (h & 0xffffff) / 16777215;
}
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const a = h3(xi, yi, zi), b = h3(xi + 1, yi, zi), c = h3(xi, yi + 1, zi), d = h3(xi + 1, yi + 1, zi);
  const e = h3(xi, yi, zi + 1), f = h3(xi + 1, yi, zi + 1), g = h3(xi, yi + 1, zi + 1), hh = h3(xi + 1, yi + 1, zi + 1);
  const x1 = a + (b - a) * u, x2 = c + (d - c) * u, x3 = e + (f - e) * u, x4 = g + (hh - g) * u;
  const y1 = x1 + (x2 - x1) * v, y2 = x3 + (x4 - x3) * v;
  return y1 + (y2 - y1) * w;
}
function fbm(x, y, z, oct) {
  let s = 0, a = 0.5, n = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x, y, z); n += a; x = x * 2.03 + 1.7; y = y * 2.03 + 9.2; z = z * 2.03 + 3.1; a *= 0.5; }
  return s / n;
}

// ===================== レンダラー =====================
const glCanvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, logarithmicDepthBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 1.5 : 2));
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010208);
const camera = new THREE.PerspectiveCamera(CFG.baseFov, 1, 0.3, 2e6);
scene.add(camera);

scene.add(new THREE.AmbientLight(0x1c2233, 1.0));
const sunLight = new THREE.PointLight(0xfff5e6, 1.6, 0, 0);
scene.add(sunLight);

function canvasTex(cv) { const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t; }
function glowTexture(inner, outer) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d'); const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, inner); gr.addColorStop(0.25, outer); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return canvasTex(cv);
}
const GLOW_WHITE = glowTexture('rgba(255,255,255,1)', 'rgba(255,255,255,0.35)');

// ---------- 星空 ----------
const sky = new THREE.Group();
scene.add(sky);
(function buildStars() {
  const make = (n, size, bandBias, bright) => {
    const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
    const bandN = new V3(0.3, 1, 0.2).normalize(); const v = new V3();
    for (let i = 0; i < n; i++) {
      v.set(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1);
      if (v.lengthSq() > 1 || v.lengthSq() < 0.01) { i--; continue; }
      v.normalize();
      if (Math.random() < bandBias) { v.addScaledVector(bandN, -v.dot(bandN) * (0.85 + Math.random() * 0.15)).normalize(); }
      pos.set([v.x * 900000, v.y * 900000, v.z * 900000], i * 3);
      const t = Math.random(), b = bright * (0.35 + Math.random() * 0.65);
      const c = mixc([0.7, 0.8, 1.0], [1.0, 0.85, 0.65], t);
      col.set([c[0] * b, c[1] * b, c[2] * b], i * 3);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const m = new THREE.PointsMaterial({ size, sizeAttenuation: false, vertexColors: true, depthWrite: false, fog: false });
    const p = new THREE.Points(g, m); p.renderOrder = -10; sky.add(p);
  };
  make(4500, 1.4, 0.45, 0.9);
  make(500, 2.4, 0.2, 1.0);
  // 星雲
  const nebCols = [0x5a1a73, 0x0d4073, 0x30205a, 0x123a5a];
  const bandN = new V3(0.3, 1, 0.2).normalize();
  for (let i = 0; i < 14; i++) {
    const v = new V3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1).normalize();
    v.addScaledVector(bandN, -v.dot(bandN) * 0.9).normalize();
    const sm = new THREE.SpriteMaterial({ map: GLOW_WHITE, color: nebCols[i % 4], transparent: true, opacity: 0.14 + Math.random() * 0.12, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
    const s = new THREE.Sprite(sm); s.position.copy(v.multiplyScalar(850000)); s.scale.setScalar(250000 + Math.random() * 350000);
    s.renderOrder = -11; sky.add(s);
  }
})();

// ---------- 大気シェーダー ----------
const ATMO_VS = `
#include <common>
#include <logdepthbuf_pars_vertex>
varying vec3 vN; varying vec3 vP;
void main() {
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vP = wp.xyz; vN = normalize(mat3(modelMatrix) * normal);
  gl_Position = projectionMatrix * viewMatrix * wp;
  #include <logdepthbuf_vertex>
}`;
const ATMO_FS = `
#include <common>
#include <logdepthbuf_pars_fragment>
uniform vec3 color; uniform float strength;
varying vec3 vN; varying vec3 vP;
void main() {
  #include <logdepthbuf_fragment>
  vec3 n = normalize(vN); vec3 v = normalize(cameraPosition - vP); vec3 l = normalize(-vP);
  float rim = 1.0 - clamp(dot(n, v), 0.0, 1.0);
  float lit = smoothstep(-0.35, 0.5, dot(n, l));
  float a = pow(rim, 2.2) * lit * strength;
  gl_FragColor = vec4(color * a * 1.4, 1.0);
}`;

// ---------- 天体テクスチャ生成 ----------
function shade(p, x, y, z, out) {
  const sc = 2.5, s = p.seed;
  const px = x * sc + s, py = y * sc + s, pz = z * sc + s;
  let col, em = null;
  if (p.type === 0) {
    const h = fbm(px, py, pz, 5), sea = p.sea;
    if (h < sea) col = mixc(mixc([0, 0, 0], p.a, 0.45), p.a, smooth(sea - 0.25, sea, h));
    else col = mixc(p.b, p.c, smooth(sea, sea + 0.22, h));
    const lat = Math.abs(y) + (h - 0.5) * 0.2;
    col = mixc(col, [0.92, 0.95, 1.0], smooth(0.8, 0.88, lat));
  } else if (p.type === 2) {
    const warp = fbm(px, py * 3, pz, 4);
    const yv = y * 9 + warp * 3;
    const b1 = Math.sin(yv) * 0.5 + 0.5, b2 = Math.sin(yv * 2.7 + 1.3) * 0.5 + 0.5;
    col = mixc(mixc(p.a, p.b, b1), p.c, b2 * 0.5);
    const sx = x - 0.8, sy = y + 0.35, sz2 = z - 0.5; const sd = Math.sqrt(sx * sx + sy * sy + sz2 * sz2) / 1.05;
    col = mixc(col, [p.b[0] * 0.8 + 0.15, p.b[1] * 0.8 + 0.02, p.b[2] * 0.8], smooth(0.18, 0.08, sd + warp * 0.05));
  } else if (p.type === 3) {
    const h = fbm(px, py, pz, 5);
    const ridge = 1 - Math.abs(fbm(px * 2 + 3, py * 2 + 3, pz * 2 + 3, 4) * 2 - 1);
    col = mixc(mixc(p.a, p.c, h), p.b, smooth(0.86, 0.96, ridge));
  } else if (p.type === 4) {
    const h = fbm(px, py, pz, 5);
    const ridge = 1 - Math.abs(fbm(px * 1.5 + 7, py * 1.5 + 7, pz * 1.5 + 7, 5) * 2 - 1);
    const crack = smooth(0.84, 0.96, ridge);
    col = mixc(mixc(p.a, p.b, h), [p.c[0] * 0.3, p.c[1] * 0.3, p.c[2] * 0.3], crack);
    em = [p.c[0] * crack, p.c[1] * crack, p.c[2] * crack];
  } else {
    const h = fbm(px, py, pz, 5), cr = fbm(px * 3, py * 3, pz * 3, 3);
    col = mixc(p.a, p.b, h);
    const k = 0.75 + 0.5 * smooth(0.35, 0.65, cr);
    col = [col[0] * k, col[1] * k, col[2] * k];
  }
  out.col = col; out.em = em;
  if (p.clouds) {
    const q = 1.6 * sc;
    const qx = x * q + s * 2, qy = y * q + s * 2, qz = z * q + s * 2;
    const w = fbm(qx * 1.5, qy * 1.5, qz * 1.5, 3);
    out.cloud = smooth(0.5, 0.72, fbm(qx + w, qy + w, qz + w, 4)) * 0.9;
  }
}

async function genPlanetTextures(p, onRow) {
  const W = p.tex, H = p.tex / 2;
  const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
  const cv = mk(), g = cv.getContext('2d'), img = g.createImageData(W, H), d = img.data;
  let ecv, eg, eimg, ed, ccv, cg, cimg, cd;
  if (p.type === 4) { ecv = mk(); eg = ecv.getContext('2d'); eimg = eg.createImageData(W, H); ed = eimg.data; }
  if (p.clouds) { ccv = mk(); cg = ccv.getContext('2d'); cimg = cg.createImageData(W, H); cd = cimg.data; }
  const out = {};
  for (let py = 0; py < H; py++) {
    const th = (py + 0.5) / H * Math.PI, st = Math.sin(th), ct = Math.cos(th);
    for (let px = 0; px < W; px++) {
      const ph = (px + 0.5) / W * TAU;
      shade(p, -Math.cos(ph) * st, ct, Math.sin(ph) * st, out);
      const i = (py * W + px) * 4;
      d[i] = out.col[0] * 255; d[i + 1] = out.col[1] * 255; d[i + 2] = out.col[2] * 255; d[i + 3] = 255;
      if (ed) { ed[i] = out.em[0] * 255; ed[i + 1] = out.em[1] * 255; ed[i + 2] = out.em[2] * 255; ed[i + 3] = 255; }
      if (cd) { cd[i] = 255; cd[i + 1] = 255; cd[i + 2] = 255; cd[i + 3] = out.cloud * 255; }
    }
    if (py % 16 === 15) { onRow(16 * W); await new Promise(r => setTimeout(r, 0)); }
  }
  g.putImageData(img, 0, 0);
  if (eg) eg.putImageData(eimg, 0, 0);
  if (cg) cg.putImageData(cimg, 0, 0);
  return { map: canvasTex(cv), emissive: ecv ? canvasTex(ecv) : null, clouds: ccv ? canvasTex(ccv) : null };
}

function buildSun() {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 128;
  const g = cv.getContext('2d'); const img = g.createImageData(256, 128);
  for (let py = 0; py < 128; py++) for (let px = 0; px < 256; px++) {
    const th = (py + 0.5) / 128 * Math.PI, ph = (px + 0.5) / 256 * TAU;
    const x = -Math.cos(ph) * Math.sin(th), y = Math.cos(th), z = Math.sin(ph) * Math.sin(th);

function buildRings(p, root) {

  const geo = new THREE.RingGeometry(inner, outer, 128, 1);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const r = Math.hypot(pos.getX(i), pos.getY(i));
    uv.setXY(i, (r - inner) / (outer - inner), 0.5);

  const g = cv.getContext('2d'); const img = g.createImageData(512, 1);
  for (let x = 0; x < 512; x++) {

async function buildPlanets(progress) {

  let done = 0;
  for (const p of PLANETS) {
    const tex = await genPlanetTextures(p, (n) => { done += n; progress(done / total); });
    const root = new THREE.Group(); scene.add(root);
    const mat = new THREE.MeshStandardMaterial({ map: tex.map, roughness: 0.92, metalness: 0 });
    if (tex.emissive) { mat.emissiveMap = tex.emissive; mat.emissive = new THREE.Color(0xffffff); mat.emissiveIntensity = 1.4; }
    const surf = new THREE.Mesh(new THREE.SphereGeometry(p.radius, 96, 48), mat);
    surf.rotation.z = (Math.random() - 0.5) * 0.6;

    let clouds = null;

      root.add(new THREE.Mesh(new THREE.SphereGeometry(p.radius * 1.07, 64, 32), am));
    }
    if (p.rings) buildRings(p, root);
    bodies.push({ name: p.name, node: root, surf, clouds, radius: p.radius, orbit: p.orbit, angle: p.angle, orbitSpeed: p.orbitSpeed, spin: p.spin, parent: p.parent || '' });

}

function updateOrbits(dt) {
  for (const b of bodies) {
    if (b.surf) b.surf.rotation.y += b.spin * dt;
    if (b.clouds) b.clouds.rotation.y += 0.004 * dt;
    if (!b.orbit) continue;
    b.angle += b.orbitSpeed * dt;
    const c = b.parent ? findBody(b.parent).node.position : new V3();
    b.node.position.set(c.x + Math.cos(b.angle) * b.orbit, c.y, c.z + Math.sin(b.angle) * b.orbit);

}

const astPos = [], astRad = [];
function buildAsteroids(startPos) {
  const geo = new THREE.IcosahedronGeometry(1, 1);
  const pa = geo.attributes.position, v = new V3();
  for (let i = 0; i < pa.count; i++) {
    v.fromBufferAttribute(pa, i).normalize();
    const d = 1 + (vnoise(v.x * 1.8 + 5, v.y * 1.8 + 5, v.z * 1.8 + 5) - 0.5) * 0.9;
    pa.setXYZ(i, v.x * d, v.y * d, v.z * d);
  }

  const mat = new THREE.MeshStandardMaterial({ color: 0x6b615a, roughness: 0.95, flatShading: true });
  let seed = 2026; const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) | 0; return ((seed >>> 0) / 4294967296); };
  const gauss = () => { let u = 0; for (let i = 0; i < 3; i++) u += rnd(); return (u - 1.5) / 0.5; };
  const xf = [];
  const add = (pos, s) => {
    const scl = new V3(lerp(0.7, 1.3, rnd()), lerp(0.6, 1.1, rnd()), lerp(0.7, 1.4, rnd())).multiplyScalar(s);
    const q = new Q().setFromEuler(new THREE.Euler(rnd() * TAU, rnd() * TAU, rnd() * TAU));
    xf.push(new THREE.Matrix4().compose(pos, q, scl));
    astPos.push(pos); astRad.push((scl.x + scl.y + scl.z) / 3 * 0.95);

    const a = rnd() * TAU, r = lerp(BELT_INNER, BELT_OUTER, rnd());
    add(new V3(Math.cos(a) * r, gauss() * 350, Math.sin(a) * r), rnd() > 0.05 ? lerp(15, 140, rnd()) : lerp(200, 400, rnd()));
  }
  for (let i = 0; i < OUTER_COUNT; i++) {
    const a = rnd() * TAU, r = lerp(OUTER_INNER, OUTER_OUTER, rnd());
    add(new V3(Math.cos(a) * r, gauss() * 1200, Math.sin(a) * r), rnd() > 0.08 ? lerp(40, 260, rnd()) : lerp(400, 900, rnd()));
  }
  const cl = startPos.clone().add(new V3(2600, 0, -2200));
  for (let i = 0; i < 220; i++) add(cl.clone().add(new V3(gauss(), gauss() * 0.5, gauss()).multiplyScalar(700)), lerp(6, 60, rnd()));

}
function collideAsteroids(p, r, cb) {

    const rr = astRad[i] + r;
    if (p.distanceToSquared(astPos[i]) < rr * rr) cb(astPos[i], astRad[i]);

}

const gates = [];
const G = { index: 0, time: 0, best: 0, running: false, finished: false, prevSide: 0 };
function buildGates(startPos) {
  let seed = 77; const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) | 0; return ((seed >>> 0) / 4294967296); };
  const pos = startPos.clone().add(new V3(0, 0, -350));
  const dir = new V3(0.25, 0.15, -1).normalize();
  const geo = new THREE.TorusGeometry(GATE_RADIUS, 3, 10, 48);
  for (let i = 0; i < GATE_COUNT; i++) {

    const m = new THREE.Mesh(geo, mat);
    m.position.copy(pos);
    m.quaternion.setFromUnitVectors(new V3(0, 0, 1), dir);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW_WHITE, color: 0xff8a26, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
    glow.scale.setScalar(GATE_RADIUS * 3.2); m.add(glow);
    scene.add(m);
    gates.push({ mesh: m, mat, glow, normal: dir.clone() });
    dir.applyAxisAngle(new V3(0, 1, 0), (rnd() - 0.5) * 1.2);
    const side = new V3().crossVectors(dir, new V3(0, 1, 0)).normalize();

function updateGates(dt) {

  const g = gates[G.index];

  if (G.prevSide < 0 && side >= 0) {
    const rel = ship.pos.clone().sub(g.mesh.position);

      }

  }

}

function updateShip(dt) {
  const [pi, ya, ro] = readRotationInput();
  // 回転
  const rs = ship.warp === 2 ? 0.3 : 1;
  ship.ang.lerp(new V3(pi * CFG.pitchRate * rs, ya * CFG.yawRate * rs, ro * CFG.rollRate * rs), damp(CFG.rotResp, dt));

  ship.quat.multiply(tmpQ.setFromAxisAngle(AY, ship.ang.y * dt));
  ship.quat.multiply(tmpQ.setFromAxisAngle(AZ, ship.ang.z * dt));
  ship.quat.normalize();
  // スロットル・ブースト
  ship.throttle = clamp(ship.throttle + axis('throttle_down', 'throttle_up') * CFG.throttleRate * dt, -CFG.reverse, 1);
  const wantBoost = held('boost') && ship.throttle > 0 && ship.warp === 0;
  if (wantBoost && ship.boostE > 0) { ship.boosting = true; ship.boostE = Math.max(ship.boostE - CFG.boostDrain * dt, 0); }
  else { ship.boosting = false; if (!held('boost')) ship.boostE = Math.min(ship.boostE + CFG.boostRegen * dt, 1); }
  // ワープ
  if (ship.warp === 1) {
    ship.warpT += dt;
    if (ship.warpT >= CFG.warpSpool) { ship.warp = 2; ship.warpSpeed = Math.max(ship.vel.length(), CFG.maxSpeed); showMsg('ワープ！'); }
  } else if (ship.warp === 2) {
    const n = nearestBody(ship.pos);
    let limit = CFG.warpMax;
    if (n) {
      limit = clamp(n.surface * 0.7, 400, CFG.warpMax);
      if (n.surface < n.body.radius * 0.5) exitWarp(`重力井戸に捕捉 — ${n.body.name} 付近でワープ離脱`);
    }
    if (ship.warp === 2) {
      if (ship.warpSpeed < limit) ship.warpSpeed = Math.min(ship.warpSpeed + CFG.warpAccel * dt, limit);

    if (ship.fa) {

      ship.vel.addScaledVector(right, sx * CFG.thrustAccel * 0.6 * dt).addScaledVector(up, sy * CFG.thrustAccel * 0.6 * dt);
      if (ship.vel.length() > cap * 1.2) ship.vel.setLength(cap * 1.2);

  // 衝突

  if (ship.warp !== 2) collideAsteroids(ship.pos, ship.radius, (c, r) => pushOut(c, r + ship.radius, 0.5));

  ship.boostAmt = lerp(ship.boostAmt, ship.boosting ? 1 : 0, damp(6, dt));
  ship.warpAmt = lerp(ship.warpAmt, ship.warp === 2 ? clamp(ship.warpSpeed / 4000, 0, 1) : 0, damp(4, dt));

  updateEngine(dt);
}

const cam = { mode: 0, shake: 0, q: new Q(), init: false };

  cam.q.slerp(ship.quat, damp(CAM_SMOOTH[cam.mode], dt));
  const sr = clamp(ship.vel.length() / 750, 0, 1);

  const pos = ship.pos.clone().add(off.applyQuaternion(cam.q));

const DUST_N = 360, DUST_EXT = 260;

  ctx.strokeStyle = COL.dim; ctx.strokeRect(x, by2, bw, 5 * k);
  ctx.fillStyle = 'rgba(255,150,60,0.9)'; ctx.fillRect(x, by2, bw * ship.boostE, 5 * k);
  text(x + bw + 8, by2 + 6 * k, 'BOOST', 10 * k, 'rgba(255,150,60,0.95)');
  const by3 = by2 + 24 * k;
  text(x, by3, ship.fa ? 'FA: ON' : 'FA: OFF', 12 * k, ship.fa ? COL.main : COL.warn);
  text(x + 70 * k, by3, ['WARP: 待機', 'WARP: 充填中', 'WARP: 航行中'][ship.warp], 12 * k, ship.warp ? COL.warp : COL.dim);
  if (ship.aligning) text(x + 175 * k, by3, 'AUTO-ALIGN', 12 * k, COL.target);

  // ターゲット
  const tx = top ? Math.max(16 + 260 * k, VW * 0.34) : VW - 16 - 250 * k;
  const ty0 = top ? 10 + 20 * k : VH - 150 * k;
  const dir = tg.node.position.clone().sub(ship.pos).normalize(), closing = ship.vel.dot(dir);
  text(tx, ty0, top ? 'TARGET' : 'TARGET  (T: 切替 / Y長押し: 自動旋回)', 11 * k, COL.dim);
  text(tx, ty0 + 24 * k, tg.name, 20 * k, COL.target);
  text(tx, ty0 + 44 * k, `距離 ${fmtDist(td)}`, 13 * k, COL.main);
  text(tx, ty0 + 62 * k, `接近 ${Math.round(closing)} m/s   ETA ${closing > 1 ? fmtTime(td / closing) : '--:--'}`, 13 * k, COL.main);

  // ゲート
  const gx = VW - 16 - 200 * k, gy = top ? 12 + 58 * k : 30 * k;
  text(gx, gy, 'GATE COURSE', 11 * k, COL.dim);
  if (G.finished) text(gx, gy + 22 * k, `完走 ${G.time.toFixed(2)} 秒`, 17 * k, COL.gate);
  else text(gx, gy + 22 * k, `${G.index} / ${gates.length}   ${G.time.toFixed(2)} 秒`, 17 * k, COL.gate);
  if (G.best > 0) text(gx, gy + 40 * k, `ベスト ${G.best.toFixed(2)} 秒`, 12 * k, COL.main);

  // 近接警告
  const nb = nearestBody(ship.pos);
  if (nb) {
    const cl = ship.vel.dot(nb.body.node.position.clone().sub(ship.pos).normalize());
    if (nb.surface < 600 && cl > 20 && Math.floor(performance.now() / 250) % 2 === 0)
      text(cx, cy - 90 * k, `⚠ 近接警告  ${nb.body.name}  高度 ${fmtDist(nb.surface)}`, 18 * k, COL.warn, 'center');
  }
  // ワープ充填
  if (ship.warp === 1) {
    const w = 240 * k, r = ship.warpT / CFG.warpSpool;
    ctx.strokeStyle = COL.dim; ctx.strokeRect(cx - w / 2, cy + 60 * k, w, 6 * k);
    ctx.fillStyle = COL.warp; ctx.fillRect(cx - w / 2, cy + 60 * k, w * r, 6 * k);
    text(cx, cy + 54 * k, 'WARP CHARGING', 12 * k, COL.warp, 'center');
  }
  // メッセージ
  if (UI.msgT > 0) text(cx, top ? VH * 0.3 : 80 * k, UI.msg, 18 * k, `rgba(255,255,255,${clamp(UI.msgT, 0, 1)})`, 'center');

  if (UI.map) { drawMap(); if (UI.touch) { const mb = buttons.find(b => b.id === 'map'); circle(mb.x, mb.y, mb.r, COL.active, COL.dim); text(mb.x, mb.y + 4 * S, 'MAP', 11 * S, COL.text, 'center'); } return; }
  if (UI.touch) drawTouchUI();
  else if (document.pointerLockElement !== hud) text(cx, cy + 120 * k, 'クリックでマウス操縦（Esc で解除）', 16 * k, 'rgba(255,255,255,0.85)', 'center');
  if (VH > VW * 1.05) text(cx, VH * 0.45, '横向きにすると遊びやすくなります', 15 * k, COL.target, 'center');
  if (UI.help) drawHelp();
}

// ---------- 星系マップ（距離は平方根スケール） ----------
let mapPts = [];
function mapGeom() {
  const top = UI.touch ? 64 * S : 16, R = Math.max(60, Math.min(VW * 0.5 - 24, (VH - top - 16) * 0.5));
  return { cx: VW / 2, cy: top + (VH - top - 16) / 2, R };
}
const mapR = (d, R) => Math.sqrt(Math.max(d, 0) / SYSTEM_RADIUS) * R;
function mapXY(p, g) { const d = Math.hypot(p.x, p.z), r = mapR(d, g.R), a = Math.atan2(p.z, p.x); return [g.cx + Math.cos(a) * r, g.cy + Math.sin(a) * r]; }
function drawMap() {
  const g = mapGeom(), k = S;
  ctx.fillStyle = 'rgba(1,5,14,0.86)'; ctx.fillRect(0, 0, VW, VH);
  // 小惑星帯
  for (const [a, b] of [[BELT_INNER, BELT_OUTER], [OUTER_INNER, OUTER_OUTER]]) {
    ctx.beginPath(); ctx.arc(g.cx, g.cy, (mapR(a, g.R) + mapR(b, g.R)) / 2, 0, TAU);
    ctx.strokeStyle = 'rgba(180,160,140,0.22)'; ctx.lineWidth = Math.max(3, mapR(b, g.R) - mapR(a, g.R)); ctx.stroke();
  }
  mapPts = [];
  for (const b of bodies) {
    if (!b.parent && b.orbit) circle(g.cx, g.cy, mapR(b.orbit, g.R), null, 'rgba(115,227,255,0.14)', 1);
  }
  bodies.forEach((b, i) => {
    let [x, y] = mapXY(b.node.position, g);
    if (b.parent) {
      // 衛星は親の周りに少し離して描く
      const pp = findBody(b.parent).node.position, [px, py] = mapXY(pp, g);
      const a = Math.atan2(b.node.position.z - pp.z, b.node.position.x - pp.x);
      x = px + Math.cos(a) * 14 * k; y = py + Math.sin(a) * 14 * k;
    }
    const sel = i === targetIndex;
    const rad = b.parent ? 2.5 * k : clamp(Math.sqrt(b.radius) / 14, 3, 8) * k;
    circle(x, y, rad, i === 0 ? '#ffcf6a' : (b.parent ? 'rgba(200,210,220,0.8)' : 'rgba(170,220,255,0.95)'));
    if (sel) circle(x, y, rad + 6 * k, null, COL.target, 2);
    if (!b.parent || sel) text(x + rad + 4 * k, y + 4 * k, b.name, (b.parent ? 10 : 11.5) * k, sel ? COL.target : 'rgba(232,248,255,0.85)');
    mapPts.push({ i, x, y });
  });
  // 自機
  const [sx, sy] = mapXY(ship.pos, g), f = fwdOf(ship.quat), fa = Math.atan2(f.z, f.x);
  ctx.beginPath();
  ctx.moveTo(sx + Math.cos(fa) * 9 * k, sy + Math.sin(fa) * 9 * k);
  ctx.lineTo(sx + Math.cos(fa + 2.5) * 6 * k, sy + Math.sin(fa + 2.5) * 6 * k);
  ctx.lineTo(sx + Math.cos(fa - 2.5) * 6 * k, sy + Math.sin(fa - 2.5) * 6 * k);
  ctx.closePath(); ctx.fillStyle = COL.pro; ctx.fill();
  text(16, VH - 14, UI.touch ? '天体をタップで目的地に設定 / MAP で閉じる' : '天体をクリックで目的地に設定 / M で閉じる', 12 * k, COL.dim);
  text(VW - 16, VH - 14, `星系半径 ${fmtDist(SYSTEM_RADIUS)}`, 12 * k, COL.dim, 'right');
}
function mapTap(x, y) {
  let best = null, bd = 30 * S;
  for (const p of mapPts) { const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = p; } }
  if (best) { targetIndex = best.i; UI.map = false; showMsg('目的地: ' + bodies[best.i].name + '（自動旋回で向けます）', 2.5); }
}

function drawHelp() {
  const k = S;
  const lines = UI.touch ? [
    '■ タッチ操作（画面タップで閉じる）',
    '左半分をドラッグ : 機首の向き',
    '右端 THR : スロットル（線より下は後退）',
    'BOOST 長押し : 加速 / WARP : ワープ',
    '自動旋回 長押し : ターゲットへ向く',
    '↺ ↻ : ロール   ▲ ▼ : 上下移動',
    'MAP : 星系マップ（タップで目的地）',
    'TGT : ターゲット切替  CAM : カメラ',
    'FA : 慣性飛行切替  ↩ : リスタート',
  ] : [
    '■ 操作説明 (H で閉じる)',
    'マウス : 機首の向き（クリックで開始）',
    'W / S : スロットル   X : 0   ホイール : 微調整',
    'A / D : ロール   Q / E : 左右移動',
    'Space / Ctrl : 上下移動   矢印 : ピッチ/ヨー',
    'Shift : ブースト   Tab : ワープ',
    'T : ターゲット切替   Y 長押し : 自動旋回   M : 星系マップ',
    'Z : フライトアシスト   C : カメラ切替',
    'V : 照準センタリング   I : 上下反転',
    'Backspace : リスタート   G : タッチ操作UI',
  ];
  const lh = 20 * k, w = Math.min(430 * k, VW - 32), h = lh * lines.length + 16 * k;
  const x = UI.touch ? (VW - w) / 2 : 16, y = UI.touch ? (VH - h) / 2 : 16;
  ctx.fillStyle = 'rgba(2,10,22,0.78)'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = COL.dim; ctx.lineWidth = 1; ctx.strokeRect(x, y, w, h);
  lines.forEach((l, i) => text(x + 12 * k, y + 22 * k + i * lh, l, (i ? 12.5 : 14) * k, i ? COL.main : COL.target));
}

// ===================== ループ =====================
function resize() {
  const r = document.getElementById('wrap').getBoundingClientRect();
  VW = Math.max(1, r.width); VH = Math.max(1, r.height); DPR = Math.min(window.devicePixelRatio || 1, 2);
  S = clamp(Math.min(VW, VH) / 400, 0.72, 1.45);
  renderer.setSize(VW, VH, false);
  hud.width = Math.round(VW * DPR); hud.height = Math.round(VH * DPR);
  camera.aspect = VW / VH; camera.updateProjectionMatrix();
  layout();
}
addEventListener('resize', resize);

let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now;
  updateOrbits(dt);
  if (UI.started) { updateShip(dt); updateGates(dt); }
  else { shipModel.position.copy(ship.pos); shipModel.quaternion.copy(ship.quat); updateEngine(dt); }
  updateCamera(dt);
  updateDust();
  UI.msgT = Math.max(UI.msgT - dt, 0);
  renderer.render(scene, camera);
  drawHUD();
  requestAnimationFrame(frame);
}

// ===================== 起動 =====================
(async function boot() {
  const prog = document.getElementById('prog'), go = document.getElementById('go');
  document.getElementById('keys').innerHTML = IS_TOUCH
    ? '<b>左ドラッグ</b> 旋回　<b>右端スライダー</b> スロットル　<b>BOOST / WARP</b> 加速・ワープ　<b>MAP</b> 星系マップ'
    : '<b>マウス</b> 旋回　<b>W/S</b> スロットル　<b>Shift</b> ブースト　<b>Tab</b> ワープ　<b>M</b> 星系マップ　<b>H</b> 操作説明';
  resize();
  buildSun();
  buildShipModel();
  await buildPlanets((r) => { prog.style.width = Math.round(r * 100) + '%'; });
  updateOrbits(0);
  startXf.pos.copy(findBody('テラノヴァ').node.position).add(new V3(0, 400, 6000));
  buildAsteroids(startXf.pos);
  buildGates(startXf.pos);
  resetShip(); resetGates();
  initDust(startXf.pos);
  targetIndex = bodies.indexOf(findBody('テラノヴァ'));
  prog.style.width = '100%';
  go.disabled = false; go.textContent = '発進';
  requestAnimationFrame(frame);
  go.addEventListener('click', () => {
    document.getElementById('start').hidden = true;
    UI.started = true; last = performance.now();
    showMsg(UI.touch ? '右のスライダーを上げて発進' : 'W でスロットルを上げて発進（クリックでマウス操縦）', 5);
  });
})();
</script>
